<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鉄の大陸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 上に国力と時間の帯、中央に作戦地図、右に司令部の机（タブ）。狭い画面では地図の下に机を積む */
:root {
  --bg: #191E1B;
  --panel: #212823;
  --panel-2: #29312B;
  --line: #3A453D;
  --ink: #E7E2D2;
  --muted: #A29D8C;
  --brass: #CDA85E;
  --brass-ink: #1E1A10;
  --danger: #D8664D;
  --ok: #8CB466;
  --sea: #22323A;
  --display: "Zen Antique", "Yu Mincho", "Hiragino Mincho ProN", serif;
  --ui: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 13px; line-height: 1.55; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { font-family: var(--display); font-size: 1.35rem; letter-spacing: .12em; color: var(--brass); white-space: nowrap; }
.b-nat { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(0,0,0,.5); flex: none; }
.res { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.res span { white-space: nowrap; }
.res b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.res i { font-style: normal; color: var(--muted); font-size: .8rem; margin-right: 4px; }
.time { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.date { font-family: var(--display); font-size: 1.05rem; min-width: 9.5em; text-align: right; white-space: nowrap; }
.play { width: 34px; height: 30px; border: 1px solid var(--brass); background: var(--brass); color: var(--brass-ink); border-radius: 4px; cursor: pointer; font-weight: 700; }
.play.paused { background: transparent; color: var(--brass); }
.presets { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.presets button { border: 0; background: transparent; width: 26px; height: 28px; cursor: pointer; font-family: var(--mono); }
.presets button[aria-pressed="true"] { background: var(--panel-2); color: var(--brass); }
#b-spd { width: 110px; accent-color: var(--brass); }
.spdv { font-family: var(--mono); min-width: 6.2em; color: var(--muted); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.ctx { position: absolute; left: 16px; bottom: 16px; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 90px); overflow: auto;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 10px; }
/* 右上のズームボタン（幅34px）の左に置き、ボタンを隠さない */
.guide { position: absolute; top: 58px; right: 58px; width: min(290px, calc(100% - 74px)); max-height: calc(100% - 150px); overflow: auto;
  background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; }
.guide-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.guide-head b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
.guide ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.guide li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 8px; background: var(--panel-2); border-radius: 4px; }
.guide li.done { opacity: .55; }
.guide li small { grid-column: 1 / -1; color: var(--muted); font-size: .75rem; }
.guide .btn { padding: 2px 8px; }
.ctx-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ctx-head b { font-family: var(--display); font-size: 1.05rem; font-weight: 400; }
.ctx p { margin: 0; }
.tip { color: var(--muted); font-size: .8rem; }
.urow { display: grid; grid-template-columns: 4.8em minmax(0, 1fr) 4.5em; gap: 8px; align-items: center; font-size: .8rem; }
.bars { display: grid; gap: 2px; }
.divs { display: grid; gap: 6px; }
.divhead, .ubtn { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 4px; cursor: pointer; padding: 3px 6px; background: transparent; }
.divhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; background: var(--panel-2); }
.divhead[aria-pressed="true"] { border-color: var(--brass); }
.divhead:hover, .ubtn:hover { border-color: var(--line); }
.ubtn[aria-pressed="false"] { opacity: .5; }
.meter { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.meter > span { display: block; height: 100%; }
.m-hp > span { background: var(--ink); }
.m-org > span { background: var(--ok); }
.m-prog > span { background: var(--brass); }
.m-ship > span { background: #8FC3DA; }
.log { position: absolute; top: 12px; left: 16px; right: 70px; display: grid; gap: 3px; pointer-events: none; }
.log div { justify-self: start; background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 2px 8px; border-radius: 3px; font-size: .8rem; max-width: 100%; }
.log .war, .log .bad { color: var(--danger); }
.log .good { color: var(--ok); }
.zoom { position: absolute; right: 16px; top: 12px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 1.1rem; }

.side { display: grid; grid-template-rows: auto minmax(0, 1fr); border-left: 1px solid var(--line); background: var(--panel); min-height: 0; min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(8, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 2px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 700; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
#panel { overflow: auto; padding: 14px 16px 24px; display: grid; gap: 14px; align-content: start; }
#panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0; line-height: 1.2; }
#panel h3 { font-size: .75rem; letter-spacing: .14em; color: var(--brass); margin: 4px 0 0; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--mono); }
.list { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); border-radius: 5px; }
.item .t { font-weight: 700; }
.item .d { color: var(--muted); font-size: .8rem; grid-column: 1; }
.item .meter { grid-column: 1 / -1; }
.item.done { opacity: .5; }
.item.locked .t { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 700; }
.btn.warn { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper .btn { padding: 2px 9px; }
.stepper b { font-family: var(--mono); min-width: 2ch; text-align: center; font-weight: 500; }
.news { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .8rem; }
.news li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 8px; }
.news .dt { color: var(--muted); font-family: var(--mono); font-size: .75rem; }
.news .war, .news .bad { color: var(--danger); }
.news .good { color: var(--ok); }
.help { margin: 0; padding-left: 1.2em; color: var(--muted); display: grid; gap: 3px; font-size: .82rem; }
.help b { color: var(--ink); }
.status { font-size: .75rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.status.war { border-color: var(--danger); color: var(--danger); }
.status.ally { border-color: var(--ok); color: var(--ok); }

.overlay { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: flex-start; padding: 70px 16px 16px; }
.sheet { pointer-events: auto; width: min(460px, 100%); max-height: 100%; overflow: auto; background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.sheet h1 { font-family: var(--display); font-weight: 400; font-size: 2.3rem; margin: 0; letter-spacing: .14em; color: var(--brass); line-height: 1.1; }
.sheet p { margin: 0; color: var(--muted); }
.natlist { display: grid; gap: 6px; }
.natcard { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.natcard[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.natcard .n { font-weight: 700; }
.natcard .s { font-size: .78rem; color: var(--muted); }
.natcard .tag { font-size: .72rem; color: var(--muted); }
.natcard .tag.ag { color: var(--danger); }
.seg .btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-weight: 700; max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; }
.toast.war { background: var(--danger); color: #fff; }
.helpbtn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--brass); cursor: pointer; font-weight: 700; }
.helpbtn:hover { border-color: var(--brass); }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.35rem; color: var(--ink); line-height: 1.3; }
/* 遊び方と用語集 */
.modal { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8,10,9,.6); }
.manual { width: min(760px, 100%); max-height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
.manual-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 10px; }
.manual-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--brass); letter-spacing: .08em; }
.manual-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; border-bottom: 1px solid var(--line); }
.manual-body { overflow: auto; padding: 4px 18px 22px; overscroll-behavior: contain; }
.manual-body section { padding-top: 14px; display: grid; gap: 8px; }
.manual-body h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.15rem; color: var(--ink); }
.manual-body p, .manual-body li { color: var(--muted); }
.manual-body p { margin: 0; }
.manual-body b { color: var(--ink); }
.manual-body ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; }
.goal { padding: 10px 12px; border-radius: 6px; background: var(--panel-2); border-left: 3px solid var(--ok); }
.goal.lose { border-left-color: var(--danger); }
.goal p { color: var(--ink); }
.terms { margin: 0; display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 6px 14px; }
.terms dt { font-weight: 700; color: var(--ink); }
.terms dd { margin: 0; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; font-size: .8rem; min-width: 100%; }
.tbl th, .tbl td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 700; }
.tbl td { font-family: var(--mono); }
.tbl td:first-child { font-family: var(--ui); color: var(--ink); }
@media (max-width: 560px) { .terms { grid-template-columns: minmax(0, 1fr); gap: 2px; } .terms dd { margin-bottom: 8px; } }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 64vh; min-height: 360px; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  #panel { overflow: visible; }
  .time { margin-left: 0; }
  .overlay { padding-top: 16px; align-items: flex-end; }
  .sheet { max-height: 70%; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <span class="logo">鉄の大陸</span>
    <div class="b-nat" id="b-nat"></div>
    <div class="res" id="b-res"></div>
    <div class="time">
      <span class="date" id="b-date"></span>
      <button type="button" class="play paused" id="b-play" aria-label="時間を進める">▶</button>
      <div class="presets" id="b-pre" role="group" aria-label="速度の目安">
        <button type="button" data-s="0.5">1</button><button type="button" data-s="1">2</button><button type="button" data-s="2">3</button><button type="button" data-s="5">4</button><button type="button" data-s="12">5</button>
      </div>
      <input type="range" id="b-spd" min="0" max="100" step="1" aria-label="時間の速さ">
      <span class="spdv" id="b-spdv"></span>
      <button type="button" class="helpbtn" id="b-help" aria-label="遊び方と用語集" title="遊び方と用語集">？</button>
    </div>
  </header>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="大陸の作戦地図"></canvas>
      <div class="log" id="log" aria-hidden="true"></div>
      <div class="zoom"><button type="button" id="z-in" aria-label="拡大">＋</button><button type="button" id="z-out" aria-label="縮小">－</button><button type="button" id="z-fit" aria-label="全体を表示">⌖</button></div>
      <section class="guide" id="guide" aria-label="序盤の案内" hidden></section>
      <div class="ctx" id="ctx" hidden></div>
    </div>
    <aside class="side">
      <nav class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="ov">国家</button>
        <button type="button" role="tab" data-tab="ar">陸軍</button>
        <button type="button" role="tab" data-tab="pr">生産</button>
        <button type="button" role="tab" data-tab="bu">建設</button>
        <button type="button" role="tab" data-tab="re">研究</button>
        <button type="button" role="tab" data-tab="fo">方針</button>
        <button type="button" role="tab" data-tab="na">海軍</button>
        <button type="button" role="tab" data-tab="di">外交</button>
      </nav>
      <div id="panel"></div>
    </aside>
  </div>
</div>
<div class="overlay" id="start">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="offer" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="offer-title" id="offer-body"></div>
</div>
<div class="modal" id="manual" hidden>
  <div class="manual" role="dialog" aria-modal="true" aria-labelledby="manual-title">
    <div class="manual-head"><h2 id="manual-title">遊び方と用語集</h2><button type="button" class="btn" id="manual-close">閉じる</button></div>
    <nav class="manual-nav" id="manual-nav" aria-label="目次"></nav>
    <div class="manual-body" id="manual-body"></div>
  </div>
</div>

    ctx.font = `${Math.round(12 * zs)}px sans-serif`; ctx.fillStyle = '#F0CF7A'; ctx.fillText('⚔', x, y + 1);

const pointers = new Map(); let drag = null, pinch = null;
const provAt = (cx, cy) => { const mx = Math.floor(cx / view.s + view.x), my = Math.floor(cy / view.s + view.y); if (mx < 0 || my < 0 || mx >= M.MW || my >= M.MH) return -1; return M.pix[my * M.MW + mx]; };
const zoneAt = (cx, cy) => { const mx = Math.floor(cx / view.s + view.x), my = Math.floor(cy / view.s + view.y); if (mx < 0 || my < 0 || mx >= M.MW || my >= M.MH) return -1; return M.zpix[my * M.MW + mx]; };

function zoomAt(cx, cy, f) { const mx = cx / view.s + view.x, my = cy / view.s + view.y; view.s *= f; clampView(); view.x = mx - cx / view.s; view.y = my - cy / view.s; needDraw = true; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect(); pointers.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, button: e.button };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: view.s }; drag = null; }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const r = cv.getBoundingClientRect(); pointers.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.s * d / pinch.d) / view.s);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 5) drag.moved = true;
    if (drag.moved) { view.x = drag.vx - dx / view.s; view.y = drag.vy - dy / view.s; needDraw = true; }
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  const pt = pointers.get(e.pointerId); pointers.delete(e.pointerId);
  if (drag && !drag.moved && e.type === 'pointerup') {
    const pid = provAt(pt.x, pt.y), zid = pid < 0 ? zoneAt(pt.x, pt.y) : -1;
    if (drag.button === 2) rightClick(pid, zid); else leftClick(pid, e.shiftKey, zid);
  }
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) drag = null;

cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0015)); }, { passive: false });

function leftClick(pid, shift, zid = -1) {
  if (!G.running) { if (pid >= 0) { startPick = P[pid].ctrl; mapDirty = true; renderStart(); } return; }
  if (pid < 0) {
    if (zid >= 0) {
      const mine = ships.filter(s => s.nat === G.player && s.z === zid);
      if (mine.length) { if (!shift) sel.ships.clear(); sel.units.clear(); mine.forEach(s => sel.ships.add(s.id)); }
      else if (sel.ships.size) orderShips(zid);
      else if (sel.units.size) toast('海上輸送は、港にいる師団を選んで行き先の沿岸の州をクリックします');
      sel.zone = zid;
    } else { sel.zone = -1; if (!shift) { sel.units.clear(); sel.ships.clear(); } }
    sel.prov = -1; mapDirty = true; uiDirty = true; return;
  }
  sel.zone = -1;
  const mine = units.filter(u => u.nat === G.player && u.prov === pid);
  if (sel.ships.size && !mine.length) { const p = P[pid]; if (p.port && allied(G.player, p.ctrl)) orderDock(pid); }
  else if (mine.length) { if (!shift) sel.units.clear(); sel.ships.clear(); mine.forEach(u => sel.units.add(u.id)); }
  else if (sel.units.size) orderMove(pid);
  sel.prov = pid; mapDirty = true; uiDirty = true;
}
function rightClick(pid, zid = -1) {
  if (!G.running) return;
  if (sel.ships.size) { if (zid >= 0) orderShips(zid); else if (pid >= 0 && P[pid].port && allied(G.player, P[pid].ctrl)) orderDock(pid); }
  else if (sel.units.size && pid >= 0) orderMove(pid);
  uiDirty = true;
}
const selShips = () => [...sel.ships].map(id => ships.find(s => s.id === id)).filter(Boolean);
function orderShips(z) { let ok = 0; for (const s of selShips()) if (sendShip(s, [z])) ok++; if (!ok) toast('その海域へは行けません'); }
function orderDock(pid) { for (const s of selShips()) if (s.port !== pid) sendShip(s, P[pid].zones, pid); toast(`${P[pid].name}港へ向かいます`); }
function orderConvoy(pid, list) {
  const groups = new Map(); for (const u of list) { if (!groups.has(u.prov)) groups.set(u.prov, []); groups.get(u.prov).push(u); }
  let ok = 0, noPort = 0;
  for (const [from, g] of groups) {
    if (from === pid) continue;
    if (!P[from].port || !allied(G.player, P[from].ctrl)) { noPort += g.length; continue; }
    if (makeConvoy(G.player, g, from, pid)) ok += g.length;
  }
  if (ok) toast(`${ok}個大隊が海上輸送で${P[pid].name}へ向かいます`);
  else if (noPort) toast('海上輸送は港のある州からしか出発できません');
  else toast('安全な航路がありません（敵艦隊のいる海域は通れません）');
  return ok;
}
function orderMove(pid) {
  let ok = 0; const failed = [];
  detach([...sel.units].map(uById).filter(u => u && u.prov !== pid));
  for (const id of sel.units) { const u = uById(id); if (u) u.joinDiv = 0; }
  for (const id of sel.units) {
    const u = uById(id); if (!u) continue;
    if (u.prov === pid) { u.path = []; u.attacking = -1; u.prog = 0; continue; }
    const path = findPath(G.player, u.prov, pid, 'attack');
    if (path) { u.path = path; u.prog = 0; u.attacking = -1; ok++; } else failed.push(u);
  }
  const fail = failed.length;
  if (fail && canEnter(G.player, pid) && P[pid].zones.length && failed.some(u => P[u.prov].port)) { orderConvoy(pid, failed); return; }
  if (fail && !ok) toast(atWar(G.player, P[pid].ctrl) || allied(G.player, P[pid].ctrl) ? 'そこまでの道がありません' : '戦争していない国の領土には入れません');
}

let manualOpener = null, manualWasPaused = true;
function openManual(opener) {
  const secs = manualSections();
  $('manual-nav').innerHTML = secs.map(x => `<button type="button" class="btn" data-sec="${x.id}">${x.title}</button>`).join('');
  $('manual-body').innerHTML = secs.map(x => `<section id="man-${x.id}" aria-labelledby="man-h-${x.id}"><h3 id="man-h-${x.id}">${x.title}</h3>${x.html}</section>`).join('');
  manualOpener = opener || document.activeElement;
  // 読んでいる間は時間を止め、閉じたら元に戻す
  manualWasPaused = !G || G.paused;
  if (G) { G.paused = true; updateBar(); }
  $('manual').hidden = false;
  $('manual-body').scrollTop = 0; // 表示してからでないと位置を戻せない
  $('manual-close').focus();
}
function closeManual() {
  $('manual').hidden = true;
  if (G && G.running && !G.over && !G.offer && !manualWasPaused) G.paused = false;
  updateBar();
  if (manualOpener && document.contains(manualOpener)) manualOpener.focus();
}
$('b-help').addEventListener('click', e => openManual(e.currentTarget));
$('manual-close').addEventListener('click', closeManual);
$('manual').addEventListener('click', e => { if (e.target === $('manual')) closeManual(); });
$('manual-nav').addEventListener('click', e => {
  const b = e.target.closest('[data-sec]'); if (!b) return;
  const sec = $('man-' + b.dataset.sec), body = $('manual-body');
  body.scrollTop = sec.offsetTop - body.offsetTop;
});

// ================= 開始・終了 =================
const sheet = $('sheet');
function showStart(seed) {
  sheet.innerHTML = '<p>地図を作っています…</p>'; $('start').hidden = false;
  setTimeout(() => {
    newGame(seed); startPick = -1; sel.units.clear(); sel.ships.clear(); sel.zone = -1; sel.prov = -1;
    fitView(); renderStart(); updateBar(); panel.innerHTML = ''; lastPanel = ''; ctxEl.hidden = true; $('log').innerHTML = '';
  }, 30);
}
function renderStart() {
  const saved = loadSave();
  const cards = NAT.map(n => {
    const own = P.filter(p => p.owner === n.id), civ = own.reduce((s, p) => s + p.civ, 0), mil = own.reduce((s, p) => s + p.mil, 0), div = units.filter(u => u.nat === n.id).length;
    return `<button type="button" class="natcard" data-nat="${n.id}" aria-pressed="${startPick === n.id}"><span class="chip" style="background:${rgb(n.color)}"></span>
      <span><span class="n">${esc(n.name)}</span><br><span class="s">${own.length}州 · 民需${civ} 軍需${mil} · ${div}個大隊 · ${own.some(p => p.port) ? `港${own.filter(p => p.port).length}・艦${ships.filter(s => s.nat === n.id).length}` : '内陸国'}</span></span>
      <span class="tag ${n.ai === 'aggressive' ? 'ag' : ''}">${n.ai === 'aggressive' ? '拡張志向' : '防衛志向'}</span></button>`;
  }).join('');
  sheet.innerHTML = `<h1>鉄の大陸</h1>
    <p>架空の大陸で一国を率いる戦略ゲームです。工場を建て、師団を育て、隣国の野心に備えるか、自ら大陸の覇権を狙います。地図は毎回新しく作られます。</p>
    <div class="natlist" id="natlist">${cards}</div>
    <p class="tip">地図の国をクリックしても選べます。拡張志向の2国はいずれ周辺国に攻め込みます。</p>
    <div style="display:grid;gap:6px"><b>難易度</b>${diffPicker('start')}</div>
    <div class="row"><button type="button" class="btn primary" id="go" ${startPick >= 0 ? '' : 'disabled'}>${startPick >= 0 ? esc(NAT[startPick].name) + 'で始める' : '国を選んでください'}</button>
    <button type="button" class="btn" id="reroll">別の地図にする</button>
    <button type="button" class="btn" id="howto">遊び方</button>
    ${saved ? `<button type="button" class="btn" id="cont">続きから（${dateStr(saved.day)}）</button>` : ''}</div>`;
  sheet.querySelectorAll('[data-nat]').forEach(b => b.onclick = () => { startPick = +b.dataset.nat; mapDirty = true; renderStart(); });
  sheet.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { G.diff = b.dataset.diff; renderStart(); });
  $('go').onclick = () => beginGame(startPick);
  $('reroll').onclick = () => showStart(Math.floor(Math.random() * 1e9));
  $('howto').onclick = e => openManual(e.currentTarget);
  if (saved) $('cont').onclick = () => { restore(saved); afterBegin(); log('保存したゲームを再開'); };
}
function beginGame(id) {
  if (id < 0) return;
  guideDismissed = false;
  G.player = id; G.running = true; G.paused = true;
  G.guideUnitBaseline = units.filter(u => u.nat === id).length;
  log(`${NAT[id].name}の指導者に就任した。▶で時間を進めよう`, 'good');
  afterBegin();
}
function afterBegin() {
  $('start').hidden = true; startPick = -1; guideDismissed = false;
  if (G.guideUnitBaseline == null) G.guideUnitBaseline = units.filter(u => u.nat === G.player).length;
  mapDirty = true; tab = 'ov'; lastPanel = ''; lastCtx = '';
  setSpeed(G.speed || 1); renderPanel(true); renderCtx(true); updateBar();
  focusCapital();
}
function focusCapital() {
  if (!CW) return;
  const c = P[ME().cap]; view.s = Math.min(CW / M.MW, CH / M.MH) * 1.6; view.x = c.cx - CW / 2 / view.s; view.y = c.cy - CH / 2 / view.s; needDraw = true;
}
function endGame(win, kind) {
  G.over = true; G.paused = true;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  const n = ME(), own = P.filter(p => p.owner === G.player).length;
  sheet.innerHTML = `<h1>${win ? '勝利' : '降伏'}</h1>
    <p>${!win ? `${dateStr(G.day)}、${esc(n.name)}は降伏した。` : kind === 'hegemony' ? `${dateStr(G.day)}、${esc(n.name)}は大陸の州の半分以上を手にし、覇権を打ち立てた。` : `${dateStr(G.day)}、${esc(n.name)}は大陸一の国となり、残る国はすべて同盟国となった。`}</p>
    <dl class="kv">${win ? `<dt>勝ち方</dt><dd>${kind === 'hegemony' ? '覇権' : '同盟'}</dd>` : ''}<dt>経過日数</dt><dd>${G.day}日</dd><dt>最終的な領土</dt><dd>${own}州</dd><dt>滅んだ国</dt><dd>${NAT.filter(x => !x.alive).length}</dd></dl>
    <div class="row"><button type="button" class="btn primary" id="again">新しい地図で遊ぶ</button><button type="button" class="btn" id="look">地図を眺める</button></div>`;
  $('start').hidden = false;
  $('again').onclick = () => showStart(Math.floor(Math.random() * 1e9));
  $('look').onclick = () => { $('start').hidden = true; };
  updateBar();
}

// ================= ループ =================
let lastT = performance.now(), acc = 0, lastUI = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(1, (t - lastT) / 1000); lastT = t;
  if (G && G.running && !G.paused && !G.over) {
    acc += dt * G.speed; let k = 0;
    while (acc >= 1 && k < 40 && !G.over) { acc -= 1; dailyTick(); k++; }
    if (k >= 40) acc = 0;
    if (k) uiDirty = true;
  }
  if (mapDirty && M) { renderMapImage(); mapDirty = false; needDraw = true; }
  if (uiDirty) needDraw = true;
  if (needDraw) { needDraw = false; draw(); }
  if (t - lastUI > 200 && (uiDirty || t - lastUI > 1000)) { lastUI = t; uiDirty = false; updateBar(); renderPanel(); renderCtx(); renderLog(); }
}
new ResizeObserver(resize).observe(cv);
document.fonts?.ready.then(() => { needDraw = true; });
// 30日ごとの自動保存に加えて、ページを閉じる・別タブに移るときにも保存する
window.addEventListener('pagehide', () => save(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); });

function start(data) {
  G = null;
  window.claude?.hot?.snapshot?.(() => (G && G.running && !G.over ? serialize() : null));
  if (data && data.v === 1 && data.seed) { restore(data); fitView(); afterBegin(); }
  else showStart(Math.floor(Math.random() * 1e9));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
