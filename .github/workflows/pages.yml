# main ブランチに push すると、サイト版 ALLGAME を組み立てて GitHub Pages に公開する
name: サイトを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 追加のパッケージは不要（Node.js だけで組み立てる）
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
