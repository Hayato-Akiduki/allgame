name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Ensure the release tag matches the app version
        if: github.ref_type == 'tag'
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run dist
      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("ALLGAME-Setup-$version.exe", "ALLGAME-Setup-$version.exe.blockmap", 'latest.yml')
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($file in $files) {
            Copy-Item -LiteralPath "dist/$file" -Destination release-assets -ErrorAction Stop
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ALLGAME-Windows
          path: release-assets/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ALLGAME-Windows
          path: release-assets
      - name: Publish installer and update metadata together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
