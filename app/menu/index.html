<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>ALLGAME</title>
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-hover: #20242d;
    --text: #eef0f4;
    --muted: #8b92a3;
    --line: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 36px 48px 20px;
  }
  h1 { margin: 0; font-size: 34px; letter-spacing: .08em; font-weight: 800; }
  .ver { color: var(--muted); font-size: 13px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  kbd {
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 6px; font-family: inherit; font-size: 12px; color: var(--text);
  }
  main {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    padding: 8px 48px 48px;
  }
  a.card {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 150px; padding: 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    color: inherit; text-decoration: none; overflow: hidden;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  a.card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c);
  }
  a.card::after {
    content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px;
    border-radius: 50%; background: var(--c); opacity: .12; transition: opacity .15s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-3px); background: var(--panel-hover); border-color: var(--c); outline: none;
  }
  a.card:hover::after, a.card:focus-visible::after { opacity: .25; }
  .num { position: absolute; top: 18px; left: 20px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .title { font-size: 20px; font-weight: 700; line-height: 1.3; }
  .genre { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .ext { position: absolute; top: 16px; right: 18px; color: var(--muted); font-size: 12px; z-index: 1; }
  body:not(.in-app) .hint { display: none; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ALLGAME</h1>
  <span class="ver" id="ver"></span>
  <span class="hint">ゲーム中に <kbd>Alt</kbd>+<kbd>Home</kbd> でこの画面に戻る ／ <kbd>F11</kbd> 全画面</span>
</header>
<main id="list"></main>
<script>
  // アプリ（app://）の中で開いたときだけ操作のヒントを出す
  if (location.protocol === 'app:') document.body.classList.add('in-app');
  // 相対パスにしておくと、GitHub Pages のようにフォルダの下で公開しても動く
  fetch('__games.json').then((r) => r.json()).then(({ version, games }) => {
    document.getElementById('ver').textContent = 'v' + version;
    const list = document.getElementById('list');
    games.forEach((g, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.url;
      a.style.setProperty('--c', g.color);
      a.innerHTML = '<span class="num"></span><span class="title"></span><span class="genre"></span>';
      a.querySelector('.num').textContent = String(i + 1).padStart(2, '0');
      a.querySelector('.title').textContent = g.title;
      a.querySelector('.genre').textContent = g.genre;
      if (g.external) {
        // 別のサイト（公開中のミニゲームランド）は新しいタブで開く
        a.target = '_blank';
        a.rel = 'noopener';
        const ext = document.createElement('span');
        ext.className = 'ext';
        ext.textContent = '別サイト ↗';
        a.appendChild(ext);
      }
      list.appendChild(a);
    });
  });
</script>
</body>
</html>
