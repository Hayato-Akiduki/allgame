<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>ALLGAME</title>
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ゲーム機のホーム画面風のトップページ。アプリ版とサイト版で共通。
     サイト版では dashboard.js（記録・スタンプ）と backup.js（セーブ）が読み込まれ、メニューが増える。 */
  :root {
    --bg: #0a0c11;
    --panel: #151922;
    --panel-2: #1c212c;
    --line: #2a303d;
    --text: #eef0f4;
    --muted: #8d94a5;
    --accent: #4f8cff;      /* 選んでいるゲームの色に変わる */
    --tile: 196px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; color: inherit; }

  /* 選んでいるゲームの色が背景ににじむ */
  .ambient {
    position: fixed; inset: -20%; z-index: 0; pointer-events: none;
    background-color: var(--accent);
    -webkit-mask-image: radial-gradient(ellipse 55% 45% at 30% 45%, #000 0%, transparent 70%);
    mask-image: radial-gradient(ellipse 55% 45% at 30% 45%, #000 0%, transparent 70%);
    opacity: .22;
    transition: background-color .45s ease;
  }
  .screen {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: 64px 1fr 52px;
    grid-template-columns: minmax(0, 1fr); /* ゲームの列が長くても画面幅をはみ出さない（列の中で横にスクロールする） */
  }

  /* 上のバー */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 0 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .12em; font-size: 18px; }
  .brand img { width: 28px; height: 28px; }
  body.allgame-complete .brand span {
    background: linear-gradient(90deg, #f5d76e, #fff3c4, #c9a227); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .topbar .spacer { flex: 1; }
  .chip {
    display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08); font-size: 13px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  button.chip { cursor: pointer; }
  button.chip:hover, button.chip:focus-visible { background: rgba(255, 255, 255, .12); outline: none; }
  .clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }

  /* 中央 */
  main { display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 0 0 8px; }
  .shelf-label { padding: 0 40px; color: var(--muted); font-size: 13px; letter-spacing: .08em; margin-bottom: 6px; }
  .shelf {
    display: flex; gap: 18px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth;
    padding: 26px 40px 30px; scrollbar-width: none;
  }
  .shelf::-webkit-scrollbar { display: none; }
  .tile {
    position: relative; flex: none; width: var(--tile); height: var(--tile); border-radius: 18px; cursor: pointer;
    border: none; padding: 0; overflow: hidden;
    background:
      radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 55%, transparent), transparent 62%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 35%, #10131a), #10131a 75%);
    box-shadow: 0 10px 24px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 255, 255, .07);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    filter: saturate(.75) brightness(.85);
  }
  .tile .t-icon { position: absolute; inset: 0 0 28px; display: grid; place-items: center; font-size: 72px; line-height: 1; }
  .tile .t-name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px 10px; font-size: 13px; font-weight: 700; text-align: left;
    background: linear-gradient(transparent, rgba(0, 0, 0, .55)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .t-badge {
    position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    background: var(--c); color: #0a0c11; letter-spacing: .04em;
  }
  .tile .t-badge.ext { background: rgba(0, 0, 0, .45); color: var(--text); font-weight: 600; }
  .tile.sel {
    transform: scale(1.1); filter: none; z-index: 2;
    box-shadow: 0 16px 36px rgba(0, 0, 0, .5), 0 0 0 3px var(--bg), 0 0 0 6px var(--c), 0 0 28px 6px color-mix(in srgb, var(--c) 45%, transparent);
  }
  .tile:focus { outline: none; }

  .info { padding: 4px 40px 0; min-height: 132px; }
  .info .i-title { font-size: 34px; font-weight: 800; line-height: 1.2; }
  .info .i-meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .info .i-prog { font-size: 15px; margin-top: 8px; min-height: 1.4em; }
  .info .i-play {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 18px; border-radius: 22px;
    background: var(--accent); color: #0a0c11; font-weight: 800; font-size: 14px; border: none; cursor: pointer;
    transition: background-color .45s ease;
  }

  /* システムメニュー（丸いボタン） */
  .sysrow { display: flex; gap: 22px; padding: 18px 40px 0; }
  .sys { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; padding: 0; width: 74px; }
  .sys .s-ico {
    position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 24px;
    background: var(--panel-2); border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease;
  }
  .sys .s-lbl { font-size: 12px; color: var(--muted); }
  .sys.sel .s-ico { transform: scale(1.1); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--text); }
  .sys.sel .s-lbl { color: var(--text); }
  .sys:focus { outline: none; }
  .sys .dot {
    position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    background: #ff4d6d; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center;
  }

  /* 下のバー（いま押せるボタン） */
  .hints {
    display: flex; align-items: center; gap: 22px; padding: 0 40px; color: var(--muted); font-size: 13px;
    border-top: 1px solid rgba(255, 255, 255, .06); background: rgba(0, 0, 0, .25);
  }
  .hints .h { display: flex; align-items: center; gap: 7px; }
  .key {
    display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .14); color: var(--text); font-size: 12px; font-weight: 700;
  }
  .key.pad { border-radius: 50%; min-width: 24px; padding: 0; }
  .hints .spacer { flex: 1; }

  /* パネル（スタンプ・きろく・セーブ・そうさ方法） */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
    background: rgba(5, 6, 9, .72); backdrop-filter: blur(6px);
  }
  .overlay.open { display: grid; }
  .sheet {
    width: min(980px, calc(100vw - 48px)); max-height: calc(100vh - 120px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6); animation: sheet-in .2s ease both;
  }
  @keyframes sheet-in { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .sheet .close { float: right; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 14px;
  }
  .btn:hover, .btn.sel, .btn:focus-visible { border-color: var(--text); outline: none; background: #252b38; }
  .btn.primary { background: var(--accent); color: #0a0c11; border-color: transparent; font-weight: 800; }
  .btn.primary.sel, .btn.primary:focus-visible { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--text); }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 150px; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rec th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.rec td { padding: 9px 8px; border-bottom: 1px solid rgba(255, 255, 255, .05); vertical-align: top; }
  table.rec td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.rec .g { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  table.rec .p { color: var(--muted); font-size: 12px; margin-top: 2px; font-weight: 400; }

  .stamps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .stamp { position: relative; display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .stamp .seal {
    flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 23px;
    border: 2px dashed var(--line); filter: grayscale(1); opacity: .45;
  }
  .stamp.got .seal {
    border: 3px solid var(--c); filter: none; opacity: 1; transform: rotate(-8deg);
    background: radial-gradient(circle, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%);
  }
  .stamp .s-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .stamp .s-goal { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .stamp:not(.got) .s-title { color: var(--muted); }
  .stamp.new { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .stamp.new::after {
    content: 'NEW'; position: absolute; top: 2px; left: 2px; font-size: 10px; font-weight: 800;
    background: var(--c); color: #0a0c11; border-radius: 4px; padding: 1px 4px;
  }
  .stamp.new .seal { animation: stamp-in .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes stamp-in { from { transform: scale(1.8) rotate(-30deg); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
  .complete {
    grid-column: 1 / -1; text-align: center; padding: 12px; border-radius: 10px; font-weight: 800;
    background: linear-gradient(90deg, #6b4e00, #c9a227, #6b4e00); color: #fff8dc;
  }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; align-items: center; font-size: 14px; }
  .keys .k { display: flex; gap: 6px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 16px; }

  /* 通知（スタンプ獲得など） */
  .toasts { position: fixed; bottom: 68px; right: 40px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    animation: toast 4.2s ease both;
  }
  .toast .ti { font-size: 22px; }
  @keyframes toast { 0% { transform: translateX(30px); opacity: 0; } 8%, 88% { transform: none; opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }

  /* ゲームを開くときの暗転 */
  .fade { position: fixed; inset: 0; z-index: 30; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .fade.on { opacity: 1; }

  @media (max-height: 700px) { :root { --tile: 160px; } .info { min-height: 112px; } .info .i-title { font-size: 26px; } }
  @media (max-width: 760px) { .topbar, .hints, .info, .sysrow, .shelf-label { padding-left: 16px; padding-right: 16px; } .shelf { padding-left: 16px; } .chip.opt { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .shelf { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="ambient"></div>
<div class="screen">
  <header class="topbar">
    <div class="brand"><img src="icon.png" alt=""><span>ALLGAME</span></div>
    <div class="spacer"></div>
    <div id="chips" style="display:flex;gap:8px"></div>
    <button class="chip" id="sound" type="button" title="効果音のオン・オフ（M）"></button>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <div class="shelf-label" id="shelf-label">ゲーム</div>
    <div class="shelf" id="shelf" role="listbox" aria-label="ゲーム"></div>
    <section class="info" id="info" aria-live="polite"></section>
    <nav class="sysrow" id="sysrow" aria-label="メニュー"></nav>
  </main>
  <footer class="hints" id="hints"></footer>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div class="fade" id="fade"></div>
<script>
(() => {
  const IN_APP = location.protocol === 'app:';
  const UI_KEY = 'allgame-ui'; // 最後に選んでいたゲームと効果音のオン・オフ（このブラウザだけの設定）
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ui = (() => { try { return JSON.parse(localStorage.getItem(UI_KEY) || '{}'); } catch { return {}; } })();
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} };
  if (ui.sound === undefined) ui.sound = true;

  // ---- 効果音（その場で合成する短い音）----
  let ac = null;
  function beep(kind) {
    if (!ui.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { move: [[740, 0, .035]], ok: [[660, 0, .05], [990, .05, .08]], back: [[520, 0, .05], [390, .05, .07]], open: [[587, 0, .04], [880, .04, .06]] }[kind];
      for (const [f, at, len] of notes) {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + len);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + .02);
      }
    } catch { /* 音が出せない環境では何もしない */ }
  }
  const renderSound = () => { $('sound').textContent = ui.sound ? '🔊' : '🔈'; $('sound').setAttribute('aria-label', ui.sound ? '効果音オン' : '効果音オフ'); };
  $('sound').addEventListener('click', () => { ui.sound = !ui.sound; saveUi(); renderSound(); beep('ok'); });
  renderSound();

  // ---- 時計 ----
  const tick = () => { const d = new Date(); $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
  tick(); setInterval(tick, 10000);

  // ---- 状態 ----
  let games = [], order = [], data = null, version = '';
  let zone = 'shelf', idx = 0, sysIdx = 0, panel = null, padConnected = false;
  const sysItems = [];
  // マウスを実際に動かしたときだけ、乗せたタイルを選ぶ（開いた瞬間にカーソルの下のタイルが選ばれたり、
  // キーボードで選んでいる最中に止まったカーソルやスクロールが選択を奪ったりしないように）
  // 直前のカーソル位置と比べて、本当に動いたかどうかを判定する（タイル側の処理より先に走るよう capture で受ける）
  let lastXY = null, movedNow = false;
  document.addEventListener('mousemove', (e) => {
    movedNow = !!(lastXY && (lastXY[0] !== e.clientX || lastXY[1] !== e.clientY));
    lastXY = [e.clientX, e.clientY];
  }, { capture: true, passive: true });
  const realMove = () => movedNow;

  fetch('__games.json').then((r) => r.json()).then((d) => {
    games = d.games || [];
    version = d.version || '';
    data = window.ALLGAME_DATA ? window.ALLGAME_DATA.load(games) : null;
    // 最近遊んだゲームを先に並べる
    order = [...games];
    if (data) {
      const last = (g) => (data.perGame[g.id] && data.perGame[g.id].last) || 0;
      order.sort((a, b) => last(b) - last(a) || games.indexOf(a) - games.indexOf(b));
    }
    const remembered = order.findIndex((g) => g.id === ui.focus);
    idx = remembered >= 0 ? remembered : 0;
    build();
  });

  function build() {
    // 上のバーの情報
    const chips = $('chips');
    if (data) {
      const got = data.stamps.filter((s) => s.got).length;
      const c1 = el('button', 'chip opt', `🏅 ${got} / ${data.stamps.length}`); c1.type = 'button'; c1.title = 'スタンプカード';
      c1.addEventListener('click', () => openPanel('stamps'));
      const c2 = el('button', 'chip opt', `⏱ ${data.totalMs ? window.ALLGAME_DATA.duration(data.totalMs) : '0分'}`); c2.type = 'button'; c2.title = 'きろく';
      c2.addEventListener('click', () => openPanel('records'));
      chips.append(c1, c2);
      if (got === data.stamps.length) document.body.classList.add('allgame-complete');
    }
    $('shelf-label').textContent = data && data.perGame && order[0] && data.perGame[order[0].id] && data.perGame[order[0].id].last ? 'ゲーム（最近遊んだ順）' : 'ゲーム';

    // タイル
    const shelf = $('shelf');
    order.forEach((g, i) => {
      const t = el('button', 'tile');
      t.type = 'button';
      t.setAttribute('role', 'option');
      t.setAttribute('aria-label', g.title);
      t.style.setProperty('--c', g.color);
      t.append(el('div', 't-icon', g.icon || '🎮'), el('div', 't-name', g.title));
      if (g.external) t.appendChild(el('span', 't-badge ext', '別サイト ↗'));
      else if (data && !data.perGame[g.id].played) t.appendChild(el('span', 't-badge', 'NEW'));
      t.addEventListener('mousemove', (e) => { if (realMove(e) && (zone !== 'shelf' || idx !== i)) { zone = 'shelf'; select(i, false); } });
      t.addEventListener('click', () => { zone = 'shelf'; select(i, false); launch(); });
      shelf.appendChild(t);
    });
    // ホイールで左右に選ぶ
    let wheelAt = 0;
    shelf.addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - wheelAt < 110) return;
      wheelAt = now;
      const d = Math.sign(e.deltaY || e.deltaX);
      if (d) { zone = 'shelf'; select(idx + d, true); }
    }, { passive: false });

    // メニューボタン
    const addSys = (icon, label, fn, dot) => {
      const b = el('button', 'sys'); b.type = 'button';
      const ico = el('div', 's-ico', icon);
      if (dot) ico.appendChild(el('span', 'dot', String(dot)));
      b.append(ico, el('div', 's-lbl', label));
      const i = sysItems.length;
      b.addEventListener('mousemove', (e) => { if (realMove(e) && (zone !== 'sys' || sysIdx !== i)) { zone = 'sys'; sysIdx = i; paint(); } });
      b.addEventListener('click', () => { zone = 'sys'; sysIdx = i; paint(); fn(); });
      sysItems.push(b);
      $('sysrow').appendChild(b);
    };
    if (data) {
      const fresh = data.stamps.filter((s) => s.isNew).length;
      addSys('🏅', 'スタンプ', () => openPanel('stamps'), fresh);
      addSys('📊', 'きろく', () => openPanel('records'));
    }
    if (window.ALLGAME_BACKUP) addSys('💾', 'セーブ', () => openPanel('save'));
    addSys('🎮', 'そうさ方法', () => openPanel('help'));

    select(idx, true, true);

    // 新しく取ったスタンプを通知
    if (data) data.stamps.filter((s) => s.isNew).slice(0, 4).forEach((s, i) => setTimeout(() => toast(s.icon, `スタンプ獲得！ ${s.title}`, s.goal), 500 + i * 650));
  }

  // ---- 表示の更新 ----
  function select(i, scroll, silent) {
    const n = order.length;
    if (!n) return;
    const next = Math.max(0, Math.min(n - 1, i));
    if (next !== idx && !silent) beep('move');
    idx = next;
    ui.focus = order[idx].id; saveUi();
    if (scroll) {
      const t = $('shelf').children[idx];
      const shelf = $('shelf');
      const left = t.offsetLeft - shelf.clientWidth / 2 + t.offsetWidth / 2;
      shelf.scrollTo({ left: Math.max(0, left) });
    }
    paint();
  }

  function paint() {
    const g = order[idx];
    document.documentElement.style.setProperty('--accent', g.color);
    [...$('shelf').children].forEach((t, i) => t.classList.toggle('sel', zone === 'shelf' && i === idx));
    sysItems.forEach((b, i) => b.classList.toggle('sel', zone === 'sys' && i === sysIdx));
    const focusEl = zone === 'shelf' ? $('shelf').children[idx] : sysItems[sysIdx];
    if (!panel && focusEl && document.activeElement !== focusEl) focusEl.focus({ preventScroll: true });

    // 選んでいるゲームの情報
    const info = $('info');
    info.textContent = '';
    info.appendChild(el('div', 'i-title', g.title));
    const meta = [g.genre];
    const pg = data && data.perGame[g.id];
    if (g.external) meta.push('別のサイトで開きます');
    else if (pg && pg.plays) meta.push(`${pg.plays}回`, window.ALLGAME_DATA.duration(pg.ms), `最後に遊んだのは ${window.ALLGAME_DATA.ago(pg.last)}`);
    else if (pg && !pg.played) meta.push('まだ遊んでいません');
    info.appendChild(el('div', 'i-meta', meta.join('　·　')));
    info.appendChild(el('div', 'i-prog', (pg && pg.progress) || ''));
    const play = el('button', 'i-play', g.external ? '↗ ひらく' : '▶ あそぶ');
    play.type = 'button'; play.tabIndex = -1;
    play.addEventListener('click', launch);
    info.appendChild(play);
    renderHints();
  }

  function renderHints() {
    const h = $('hints');
    h.textContent = '';
    const add = (keys, label) => {
      const w = el('div', 'h');
      keys.forEach((k) => w.appendChild(el('span', /^[AB]$/.test(k) ? 'key pad' : 'key', k)));
      w.appendChild(el('span', null, label));
      h.appendChild(w);
    };
    const ok = padConnected ? 'A' : 'Enter', back = padConnected ? 'B' : 'Esc';
    if (panel) {
      add(['↑', '↓'], 'えらぶ'); add([ok], 'けってい'); add([back], 'とじる');
    } else if (zone === 'shelf') {
      add(['←', '→'], 'えらぶ'); add([ok], order[idx] && order[idx].external ? 'ひらく' : 'あそぶ'); add(['↓'], 'メニュー');
    } else {
      add(['←', '→'], 'えらぶ'); add([ok], 'けってい'); add(['↑'], 'ゲームにもどる');
    }
    h.appendChild(el('div', 'spacer'));
    h.appendChild(el('span', null, `${padConnected ? '🎮 コントローラー接続中　' : ''}${IN_APP ? 'ゲーム中は Alt+Home で戻る　' : ''}v${version}`));
  }

  // ---- ゲームを開く ----
  function launch() {
    const g = order[idx];
    beep('ok');
    if (g.external) { window.open(g.url, '_blank', 'noopener'); return; }
    $('shelf').children[idx].style.transform = 'scale(1.18)';
    $('fade').classList.add('on');
    setTimeout(() => { location.href = g.url; }, 230);
  }
  // 戻ってきたとき（ブラウザの「戻る」）に暗転が残らないようにする
  window.addEventListener('pageshow', () => {
    $('fade').classList.remove('on');
    const t = $('shelf').children[idx]; if (t) t.style.transform = '';
  });

  // ---- パネル ----
  function openPanel(kind) {
    panel = kind;
    beep('open');
    const sheet = $('sheet');
    sheet.textContent = '';
    const close = el('button', 'btn close', '✕ とじる'); close.type = 'button';
    close.addEventListener('click', closePanel);
    sheet.appendChild(close);
    ({ stamps: panelStamps, records: panelRecords, save: panelSave, help: panelHelp })[kind](sheet);
    $('overlay').classList.add('open');
    const first = sheet.querySelector('.btn.primary') || close;
    first.focus({ preventScroll: true });
    markPanelFocus();
    renderHints();
  }
  function closePanel() {
    if (!panel) return;
    panel = null;
    beep('back');
    $('overlay').classList.remove('open');
    paint();
  }
  $('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closePanel(); });
  const panelButtons = () => [...$('sheet').querySelectorAll('button')];
  function markPanelFocus() { panelButtons().forEach((b) => b.classList.toggle('sel', b === document.activeElement)); }
  function movePanel(d) {
    const list = panelButtons();
    if (!list.length) return;
    const i = list.indexOf(document.activeElement);
    const next = list[(i + d + list.length) % list.length];
    next.focus(); next.scrollIntoView({ block: 'nearest' });
    beep('move'); markPanelFocus();
  }

  function panelStamps(sheet) {
    const got = data.stamps.filter((s) => s.got).length;
    sheet.appendChild(el('h2', null, 'スタンプカード'));
    sheet.appendChild(el('div', 'sub', `${got} / ${data.stamps.length} 個　·　ゲームごとのスタンプと、ゲームをまたいだ共通スタンプがあります`));
    const grid = el('div', 'stamps');
    if (got === data.stamps.length) grid.appendChild(el('div', 'complete', '🏆 スタンプコンプリート！ すべてのゲームを遊びこみました'));
    const rank = (s) => (s.isNew ? 2 : s.got ? 1 : 0);
    [...data.stamps].sort((a, b) => rank(b) - rank(a)).forEach((s) => {
      const item = el('div', `stamp${s.got ? ' got' : ''}${s.isNew ? ' new' : ''}`);
      item.style.setProperty('--c', s.color);
      item.title = s.got && s.at ? `${new Date(s.at).toLocaleDateString('ja-JP')} に獲得` : `目標: ${s.goal}`;
      const text = el('div');
      text.append(el('div', 's-title', s.title), el('div', 's-goal', s.goal));
      item.append(el('div', 'seal', s.icon), text);
      grid.appendChild(item);
    });
    sheet.appendChild(grid);
    // 一度パネルを開いたら NEW の印を消す
    data.stamps.forEach((s) => { s.isNew = false; });
    const dot = sysItems[0] && sysItems[0].querySelector('.dot'); if (dot) dot.remove();
  }

  function panelRecords(sheet) {
    const D = window.ALLGAME_DATA;
    sheet.appendChild(el('h2', null, 'きろく'));
    sheet.appendChild(el('div', 'sub', 'このブラウザで遊んだ記録です。プレイ時間は操作している間だけ数えています'));
    const stats = el('div', 'stats');
    const add = (l, v) => { const s = el('div', 'stat'); s.append(el('div', 'l', l), el('div', 'v', v)); stats.appendChild(s); };
    add('合計プレイ時間', data.totalMs ? D.duration(data.totalMs) : '—');
    add('遊んだゲーム', `${data.playedCount} / ${data.total}`);
    add('遊んだ日数', `${data.days}日`);
    add('スタンプ', `${data.stamps.filter((s) => s.got).length} / ${data.stamps.length}`);
    sheet.appendChild(stats);
    const table = el('table', 'rec');
    const head = el('tr');
    ['ゲーム', '回数', 'プレイ時間', '最後に遊んだ'].forEach((h, i) => { const th = el('th', null, h); if (i) th.style.textAlign = 'right'; head.appendChild(th); });
    table.appendChild(head);
    games.filter((g) => !g.external)
      .sort((a, b) => data.perGame[b.id].ms - data.perGame[a.id].ms)
      .forEach((g) => {
        const p = data.perGame[g.id];
        const tr = el('tr');
        const td = el('td'); const name = el('div', 'g'); name.append(el('span', null, g.icon || '🎮'), el('span', null, g.title));
        td.appendChild(name); td.appendChild(el('div', 'p', p.progress || (p.played ? '' : 'まだ遊んでいません')));
        tr.append(td, el('td', 'n', p.plays ? `${p.plays}回` : '—'), el('td', 'n', p.ms ? D.duration(p.ms) : '—'), el('td', 'n', p.last ? D.ago(p.last) : '—'));
        table.appendChild(tr);
      });
    sheet.appendChild(table);
  }

  function panelSave(sheet) {
    sheet.appendChild(el('h2', null, 'セーブ'));
    sheet.appendChild(el('div', 'sub', '全部のゲームのセーブとプレイ記録を、1つのファイルにまとめて保存・復元できます'));
    const row = el('div'); row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap';
    const ex = el('button', 'btn primary', '💾 セーブを書き出す'); ex.type = 'button';
    ex.addEventListener('click', () => { beep('ok'); window.ALLGAME_BACKUP.exportSaves(); });
    const im = el('button', 'btn', '📂 セーブを読み込む'); im.type = 'button';
    im.addEventListener('click', () => { beep('ok'); window.ALLGAME_BACKUP.importSaves(); });
    row.append(ex, im);
    sheet.appendChild(row);
    sheet.appendChild(el('div', 'note', 'パソコンを買い替えたときや、別のブラウザで続きを遊びたいときは、書き出したファイルを新しいほうで読み込んでください。読み込むと、同じゲームのセーブは上書きされます。'));
  }

  function panelHelp(sheet) {
    sheet.appendChild(el('h2', null, 'そうさ方法'));
    sheet.appendChild(el('div', 'sub', 'キーボード・マウス・コントローラーのどれでも操作できます'));
    const keys = el('div', 'keys');
    const row = (ks, label) => { const k = el('div', 'k'); ks.forEach((x) => k.appendChild(el('span', /^[AB]$/.test(x) ? 'key pad' : 'key', x))); keys.append(k, el('div', null, label)); };
    row(['←', '→'], 'ゲームをえらぶ（マウスホイールでも動かせます）');
    row(['↓', '↑'], 'ゲームの列とメニューの列を行き来する');
    row(['Enter'], 'あそぶ・けってい（Space でも OK）');
    row(['Esc'], 'パネルをとじる');
    row(['M'], '効果音のオン・オフ');
    row(['A', 'B'], 'コントローラー：A でけってい、B でもどる（十字キーかスティックでえらぶ）');
    sheet.appendChild(keys);
    sheet.appendChild(el('div', 'note', IN_APP
      ? 'ゲーム中にこの画面へ戻るときは、上のメニューの「ゲーム → ゲーム一覧に戻る」か Alt+Home を使います。F11 で全画面になります。'
      : 'ゲーム中にこの画面へ戻るときは、画面の上の真ん中にマウスを近づけると出てくる「◀ ALLGAME」を押します。F11 で全画面になります。'));
  }

  // ---- 通知 ----
  function toast(icon, title, sub) {
    const t = el('div', 'toast');
    const text = el('div'); text.append(el('div', null, title)); if (sub) { const s = el('div', null, sub); s.style.cssText = 'color:var(--muted);font-size:12px'; text.appendChild(s); }
    t.append(el('span', 'ti', icon), text);
    $('toasts').appendChild(t);
    beep('ok');
    setTimeout(() => t.remove(), 4300);
  }

  // ---- 操作（キーボード・コントローラー共通）----
  function act(a) {
    if (!order.length) return;
    if (panel) {
      if (a === 'back') closePanel();
      else if (a === 'up' || a === 'left') movePanel(-1);
      else if (a === 'down' || a === 'right') movePanel(1);
      else if (a === 'ok' && document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.click();
      return;
    }
    if (zone === 'shelf') {
      if (a === 'left') select(idx - 1, true);
      else if (a === 'right') select(idx + 1, true);
      else if (a === 'down' && sysItems.length) { zone = 'sys'; beep('move'); paint(); }
      else if (a === 'ok') launch();
    } else {
      if (a === 'left') { sysIdx = Math.max(0, sysIdx - 1); beep('move'); paint(); }
      else if (a === 'right') { sysIdx = Math.min(sysItems.length - 1, sysIdx + 1); beep('move'); paint(); }
      else if (a === 'up' || a === 'back') { zone = 'shelf'; beep('move'); paint(); }
      else if (a === 'ok') sysItems[sysIdx].click();
    }
  }
  const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'back' };
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'm' || e.key === 'M') { $('sound').click(); return; }
    if (e.key === 'Home' && !panel) { select(0, true); e.preventDefault(); return; }
    if (e.key === 'End' && !panel) { select(order.length - 1, true); e.preventDefault(); return; }
    const a = KEYMAP[e.key];
    if (!a) return;
    e.preventDefault(); // ボタン既定の Enter/Space の動きと二重にならないように
    act(a);
  });
  document.addEventListener('focusin', () => { if (panel) markPanelFocus(); });

  // コントローラー（Gamepad API）: 十字キー・左スティックで移動、A で決定、B で戻る
  const held = {};
  function pollPads() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const was = padConnected;
    padConnected = pads.length > 0;
    if (was !== padConnected) renderHints();
    const now = performance.now();
    const state = { up: false, down: false, left: false, right: false, ok: false, back: false };
    for (const p of pads) {
      const b = (i) => !!(p.buttons[i] && p.buttons[i].pressed);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      state.up ||= b(12) || ay < -.6; state.down ||= b(13) || ay > .6;
      state.left ||= b(14) || ax < -.6; state.right ||= b(15) || ax > .6;
      state.ok ||= b(0); state.back ||= b(1);
    }
    for (const k of Object.keys(state)) {
      if (state[k]) {
        const h = held[k];
        // 押した瞬間に 1 回、押しっぱなしなら少し待ってから連続で動く（決定・戻るは連続しない）
        if (!h) { held[k] = { next: now + 380 }; act(k); }
        else if (!['ok', 'back'].includes(k) && now >= h.next) { h.next = now + 120; act(k); }
      } else delete held[k];
    }
    requestAnimationFrame(pollPads);
  }
  window.addEventListener('gamepadconnected', () => { padConnected = true; renderHints(); toast('🎮', 'コントローラーをつなぎました', 'A でけってい、B でもどる'); });
  requestAnimationFrame(pollPads);
})();
</script>
</body>
</html>
