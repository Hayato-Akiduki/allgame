<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラストライン防衛戦 v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{
  --bg:#080b11;
  --panel:#111724;
  --panel-2:#192234;
  --panel-3:#222e46;
  --line:#334260;
  --line-bright:#4d648d;
  --fg:#f2f6ff;
  --muted:#a8b5cc;
  --ark:#38dcff;      /* friendly cyan */
  --ark-dim:#15536b;
  --rapture:#ff3b52;  /* enemy red */
  --burst:#ffc83d;    /* burst gold */
  --heal:#4dffb8;     /* medic green */
  --shield:#7ea8ff;   /* shield blue */
  --credit:#d48dff;   /* upgrade crystal purple */
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-data:"Chakra Petch","Consolas",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 50% 0%,#151d2e 0%,var(--bg) 75%);
  color:var(--fg);
  font-family:var(--f-body);
  -webkit-user-select:none;
  user-select:none;
  overflow-x:hidden;
}
button{font:inherit;color:inherit}

#app{
  min-height:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px 14px 10px;
  max-width:1480px;
  margin:0 auto;
}

/* ---------- Top Tactical Status Bar ---------- */
#topbar{
  flex:none;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  background:linear-gradient(180deg,#161f30,#0f1522);
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 14px;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
}
.base-hud{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.base-hud.right{align-items:flex-end}
.bh-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  width:100%;
  gap:8px;
}
.bh-title{
  font-family:var(--f-data);
  font-size:13px;
  font-weight:700;
  letter-spacing:.12em;
  display:flex;
  align-items:center;
  gap:6px;
}
.bh-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bh-title.ark{color:var(--ark)}.bh-title.ark .dot{background:var(--ark);box-shadow:0 0 8px var(--ark)}
.bh-title.enemy{color:var(--rapture)}.bh-title.enemy .dot{background:var(--rapture);box-shadow:0 0 8px var(--rapture)}
.bh-val{
  font-family:var(--f-data);
  font-size:16px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.hp-track{
  position:relative;
  width:100%;
  height:12px;
  background:#090d14;
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
}
.hp-fill{
  height:100%;
  width:100%;
  transition:width .12s ease-out;
}
.hp-fill.ark{background:linear-gradient(90deg,#1a88ff,var(--ark))}
.hp-fill.enemy{background:linear-gradient(90deg,var(--rapture),#ff7b54);margin-left:auto}
.boss-mark{
  position:absolute;
  top:0;bottom:0;
  width:2px;
  background:#fff;
  box-shadow:0 0 6px #fff;
  z-index:2;
}
.boss-mark::after{
  content:"BOSS";
  position:absolute;
  top:-1px;
  left:4px;
  font-family:var(--f-data);
  font-size:9px;
  font-weight:700;
  color:#ffd2d8;
  letter-spacing:.05em;
}

.sys{display:flex;gap:4px}
.sys .sbtn{width:34px;padding:6px 0}
.snd-wrap{position:relative}
.snd-pop{
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  z-index:30;
  width:220px;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px 12px;
  background:var(--panel);
  border:1px solid var(--line-bright);
  border-radius:8px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
}
.snd-pop label{
  display:grid;
  grid-template-columns:44px 1fr 28px;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
}
.snd-pop input{width:100%;accent-color:var(--ark);margin:0}
.snd-pop output{font-family:var(--f-data);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.snd-pop .sbtn{width:auto;padding:5px 0}
.center-hud{
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 10px;
}
.stat-pill{
  display:flex;
  flex-direction:column;
  align-items:center;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:3px 12px;
  min-width:86px;
}
.stat-pill small{
  max-width:120px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:var(--f-data);
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em;
}
.stat-pill b{
  font-family:var(--f-data);
  font-size:16px;
  font-variant-numeric:tabular-nums;
  color:var(--fg);
}
.stat-pill.wave b{color:var(--burst)}

/* ---------- Battlefield Stage ---------- */
#stage-wrap{
  flex:1 1 auto;
  min-height:220px;
  position:relative;
}
#screen{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  container-type:size;
  border:2px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#000;
  box-shadow:0 8px 28px rgba(0,0,0,.65);
}
#cv{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:none;
}

/* ---------- Overlays (Menu / Upgrade / Result / Pause) ---------- */
.ov{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.6cqw;
  background:linear-gradient(180deg,rgba(7,10,16,.78),rgba(7,10,16,.94));
  backdrop-filter:blur(4px);
  text-align:center;
  padding:2.2cqw 3cqw;
  z-index:10;
  overflow-y:auto;
}
.ov h1{
  font-family:var(--f-display);
  font-weight:400;
  font-size:max(22px,5.2cqw);
  line-height:1.08;
  margin:0;
  letter-spacing:.04em;
  text-shadow:0 0 2.2cqw rgba(56,220,255,.4);
}
.ov h1 em{font-style:normal;color:var(--rapture)}
.ov .tag{
  font-family:var(--f-data);
  font-size:max(11px,1.4cqw);
  font-weight:700;
  letter-spacing:.28em;
  color:var(--ark);
  text-transform:uppercase;
}
.ov p{
  margin:0;
  font-size:max(11px,1.5cqw);
  color:var(--fg);
  max-width:76cqw;
  line-height:1.5;
}
.menu-top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:min(92cqw,100%);
  background:rgba(25,34,52,.85);
  border:1px solid var(--line);
  border-radius:.7cqw;
  padding:.8cqw 1.6cqw;
}
.credit-badge{
  font-family:var(--f-data);
  font-size:max(11px,1.7cqw);
  font-weight:700;
  color:var(--credit);
  display:flex;
  align-items:center;
  gap:.6cqw;
}
.stages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.2cqw;
  width:min(92cqw,100%);
}
.sc{
  appearance:none;
  border:1.5px solid var(--line);
  background:linear-gradient(160deg,var(--panel-2),var(--panel));
  color:var(--fg);
  border-radius:.8cqw;
  padding:1.2cqw 1.3cqw;
  text-align:left;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:.35cqw;
  transition:transform .12s,border-color .12s,box-shadow .12s;
  position:relative;
}
.sc:hover,.sc:focus-visible{
  border-color:var(--ark);
  transform:translateY(-.25cqw);
  box-shadow:0 6px 18px rgba(56,220,255,.18);
  outline:none;
}
.sc.endless{
  border-color:#7a4dff;
  background:linear-gradient(160deg,#25193d,#131124);
}
.sc.endless:hover{border-color:var(--credit)}
.sc:disabled,.sc:disabled:hover{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--line)}
.sc .lock{color:var(--muted)}
.sc-top{display:flex;justify-content:space-between;align-items:center}
.sc .no{font-family:var(--f-data);font-size:max(11px,1.25cqw);font-weight:700;letter-spacing:.15em;color:var(--muted)}
.sc .df{font-family:var(--f-data);font-size:max(11px,1.2cqw);font-weight:700;padding:.1cqw .5cqw;border-radius:.3cqw;background:rgba(0,0,0,.35)}
.sc .df.e{color:var(--ark)}.sc .df.n{color:var(--burst)}.sc .df.h{color:var(--rapture)}.sc .df.x{color:#ff66c4}.sc .df.inf{color:var(--credit)}
.sc .nm{font-family:var(--f-display);font-size:max(11px,1.95cqw);line-height:1.2}
.sc .st{font-family:var(--f-data);font-size:max(11px,1.3cqw);color:var(--burst);margin-top:.2cqw}

.keys{
  font-family:var(--f-body);
  font-size:max(11px,1.35cqw);
  color:var(--muted);
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:.8cqw 1.5cqw;
}
.keys b{
  font-family:var(--f-data);
  color:var(--fg);
  background:var(--panel-2);
  border:1px solid var(--line-bright);
  border-radius:.35cqw;
  padding:.1cqw .55cqw;
  font-weight:700;
}

.res-title{font-family:var(--f-display);font-size:max(22px,6.5cqw);line-height:1;margin:0}
.res-title.win{color:var(--ark);text-shadow:0 0 2.5cqw rgba(56,220,255,.5)}
.res-title.lose{color:var(--rapture);text-shadow:0 0 2.5cqw rgba(255,59,82,.5)}
.stats{
  display:grid;
  grid-template-columns:repeat(5,auto);
  gap:.6cqw 2.6cqw;
  font-family:var(--f-data);
  background:rgba(17,23,36,.85);
  border:1px solid var(--line);
  border-radius:.8cqw;
  padding:1.2cqw 2.4cqw;
}
.stats div{display:flex;flex-direction:column;gap:.2cqw}
.stats span{font-size:max(11px,1.2cqw);color:var(--muted);letter-spacing:.12em}
.stats b{font-size:max(16px,2.6cqw);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.btn{
  appearance:none;
  font-family:var(--f-body);
  font-weight:900;
  font-size:max(11px,1.6cqw);
  padding:.85cqw 2.2cqw;
  border-radius:.6cqw;
  border:1.5px solid var(--line-bright);
  background:var(--panel-2);
  color:var(--fg);
  cursor:pointer;
  transition:filter .12s,transform .1s;
}
.btn.pri{background:var(--ark);border-color:var(--ark);color:#041c26}
.btn.upg{background:linear-gradient(135deg,#8b4dff,#c462ff);border-color:#d896ff;color:#fff}
.btn.warn{background:#3a1922;border-color:var(--rapture);color:#ff9aa6}
.btn:hover,.btn:focus-visible{filter:brightness(1.15);transform:translateY(-1px);outline:2px solid var(--fg);outline-offset:2px}

/* ---------- Upgrade Modal Grid ---------- */
.upg-wrap{
  width:min(94cqw,100%);
  display:flex;
  flex-direction:column;
  gap:1.2cqw;
  max-height:88cqh;
}
.upg-sec-title{
  font-family:var(--f-data);
  font-size:max(11px,1.3cqw);
  color:var(--ark);
  text-align:left;
  letter-spacing:.15em;
  margin:0;
}
.upg-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.9cqw;
}
.upg-card{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:.6cqw;
  padding:.9cqw 1cqw;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:.5cqw;
  text-align:left;
}
.upg-card .top{display:flex;justify-content:space-between;align-items:baseline}
.upg-card .nm{font-weight:900;font-size:max(11px,1.35cqw);color:var(--fg)}
.upg-card .lv{font-family:var(--f-data);font-size:max(11px,1.25cqw);color:var(--burst);font-weight:700}
.upg-card .stat{font-family:var(--f-data);font-size:max(11px,1.15cqw);color:var(--muted);line-height:1.35}
.upg-card button{
  appearance:none;
  border:1px solid var(--line-bright);
  background:var(--panel-3);
  color:var(--fg);
  border-radius:.4cqw;
  padding:.45cqw .7cqw;
  font-family:var(--f-data);
  font-size:max(11px,1.2cqw);
  font-weight:700;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.upg-card button:hover:not(:disabled){border-color:var(--credit);background:#332454}
.upg-card button:disabled{opacity:.4;cursor:default}

/* ---------- Command Dock ---------- */
#dock{
  flex:none;
  display:grid;
  grid-template-columns:200px minmax(0,1fr) 230px;
  gap:10px;
  align-items:stretch;
}
.panel{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:6px;
  min-width:0;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.en-rate{
  margin-left:auto;
  font-family:var(--f-data);
  font-size:12px;
  font-weight:700;
  color:var(--ark);
}
#dock > .panel{justify-content:center;gap:8px}
.en{
  display:flex;
  align-items:baseline;
  gap:6px;
  font-family:var(--f-data);
}
.en b{
  font-size:28px;
  color:var(--ark);
  font-variant-numeric:tabular-nums;
  line-height:1;
  text-shadow:0 0 10px rgba(56,220,255,.35);
}
.en small{
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.bar{
  height:8px;
  background:#090d14;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,#1a88ff,var(--ark));
  transition:width .08s linear;
}
.wbtn{
  appearance:none;
  border:1.5px solid var(--line-bright);
  background:var(--panel-3);
  color:var(--fg);
  border-radius:6px;
  padding:7px 10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:900;
  transition:filter .12s,border-color .12s;
}
.wbtn:hover:not(:disabled){border-color:var(--burst);filter:brightness(1.12)}
.wbtn small{font-family:var(--f-data);font-size:14px;color:var(--burst)}
.wbtn:disabled{opacity:.42;cursor:default}

/* ---------- Units Bar (8 Units) ---------- */
#units-wrap{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
#units{
  flex:1;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:7px;
}
.ub{
  appearance:none;
  position:relative;
  overflow:hidden;
  border:1.5px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  color:var(--fg);
  border-radius:8px;
  padding:4px 5px 6px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  gap:2px;
  min-width:0;
  transition:transform .1s,border-color .12s,box-shadow .12s;
  -webkit-touch-callout:none;
}
.ub:hover:not(.off){transform:translateY(-2px);border-color:var(--line-bright)}
.ub canvas{width:48px;height:48px;margin-top:10px}
.ub .cl{
  position:absolute;
  top:4px;left:5px;
  font-family:var(--f-data);
  font-size:11px;
  font-weight:700;
  padding:1px 4px;
  border-radius:3px;
  background:rgba(0,0,0,.55);
  color:var(--ark);
}
.ub .cl.med{color:var(--heal)}
.ub .cl.shd{color:var(--shield)}
.ub .k{
  position:absolute;
  top:4px;right:5px;
  font-family:var(--f-data);
  font-size:11px;
  font-weight:700;
  color:var(--fg);
  background:rgba(255,255,255,.12);
  padding:0 5px;
  border-radius:3px;
}
.ub .nm{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.ub .cost{
  font-family:var(--f-data);
  font-size:14px;
  font-weight:700;
  color:var(--burst);
  font-variant-numeric:tabular-nums;
}
.ub .cdv{
  position:absolute;
  left:0;right:0;bottom:0;
  height:calc(var(--cd,0)*100%);
  background:rgba(6,9,15,.78);
  border-top:2px solid var(--ark);
  pointer-events:none;
}
.ub .cdt{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--f-data);
  font-size:18px;
  font-weight:700;
  color:#fff;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}
.ub.off{filter:grayscale(.75) brightness(.65)}
.ub.ready{
  border-color:var(--ark);
  box-shadow:inset 0 0 0 1px rgba(56,220,255,.3),0 0 10px rgba(56,220,255,.15);
}
.ub.auto-on::after{
  content:"AUTO";
  position:absolute;
  top:22px;left:5px;
  font-family:var(--f-data);
  font-size:9px;
  font-weight:700;
  background:var(--burst);
  color:#1c1200;
  padding:0 3px;
  border-radius:2px;
}

/* ---------- Right Actions / Commander Controls ---------- */
.acts{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:6px;
}
.cmd-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
kbd{
  font-family:var(--f-data);
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  background:rgba(255,255,255,.08);
  border-radius:3px;
  padding:0 4px;
}
.cbtn{
  appearance:none;
  position:relative;
  overflow:hidden;
  border:1.5px solid var(--line-bright);
  background:var(--panel-2);
  color:var(--fg);
  border-radius:6px;
  padding:7px 8px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
}
.cbtn:hover:not(:disabled){border-color:var(--ark);background:var(--panel-3)}
.cbtn b{font-size:12px;font-weight:900;color:var(--ark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn.skill b{color:var(--heal)}
.cbtn .sk-cd{
  position:absolute;
  inset:0;
  background:rgba(8,10,16,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--f-data);
  font-size:14px;
  font-weight:700;
  color:var(--fg);
}

.burst{
  appearance:none;
  position:relative;
  overflow:hidden;
  flex:1;
  min-height:42px;
  border:1.5px solid var(--line-bright);
  border-radius:6px;
  background:var(--panel);
  color:var(--fg);
  font-family:var(--f-display);
  font-size:16px;
  letter-spacing:.06em;
  cursor:pointer;
}
.burst i{
  position:absolute;
  left:0;top:0;bottom:0;
  width:calc(var(--g,0)*100%);
  background:linear-gradient(90deg,rgba(255,200,61,.2),rgba(255,200,61,.55));
  transition:width .1s linear;
}
.burst span{position:relative;z-index:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.burst.full{
  color:#241700;
  background:var(--burst);
  border-color:#fff;
  animation:pulse .75s ease-in-out infinite alternate;
}
.burst.full i{display:none}

/* ---------------- WebAudio Sound Effects ---------------- */
let AC = null, noise = null, muted = false, bgmVol = 35, sfxVol = 100;
// BGM plays only in battle (pause screen included). It can only start after a user gesture, so initAudio()
// (called from every input handler) unlocks it; showOnly() re-syncs it on every screen change.
// Stages may name their own track in STAGES[].bgm; everything else uses the default.
const BGM_DEFAULT = 'audio/hardened_perimeter.mp3';
const bgm = new Audio(BGM_DEFAULT);
bgm.loop = true; bgm.volume = bgmVol / 100;
let bgmStarted = false;
function syncBgm() {
  bgm.volume = bgmVol / 100;
  if (!bgmStarted || muted || !bgmVol || document.hidden || S.mode !== 'play') bgm.pause();
  else if (bgm.paused) bgm.play().catch(() => {});
}
function initAudio() {
  if (!bgmStarted) { bgmStarted = true; syncBgm(); }
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noise = AC.createBuffer(1, AC.sampleRate * .6, AC.sampleRate);
    const ch = noise.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function sfx(kind) {
  if (!AC || muted || !sfxVol) return;
  const t = AC.currentTime, g = AC.createGain(), vm = sfxVol / 100; g.connect(AC.destination);
  if (kind === 'shot' || kind === 'boom') {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(); s.buffer = noise;
    f.type = kind === 'shot' ? 'highpass' : 'lowpass'; f.frequency.value = kind === 'shot' ? 1400 : 500;
    s.connect(f); f.connect(g);
    const len = kind === 'shot' ? .05 : .45;
    g.gain.setValueAtTime((kind === 'shot' ? .06 : .22) * vm, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    s.start(t); s.stop(t + len);
  } else {
    const o = AC.createOscillator();
    o.type = kind === 'burst' ? 'sawtooth' : kind === 'laser' ? 'triangle' : 'square';
    const [f0, f1, len, vol] = kind === 'burst' ? [180, 900, .5, .08] : kind === 'laser' ? [920, 260, .14, .06] : kind === 'deny' ? [160, 120, .1, .04] : [520, 880, .09, .04];
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
    g.gain.setValueAtTime(vol * vm, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g); o.start(t); o.stop(t + len);
  }
}

/* ---------------- Game Logic ---------------- */
function getCmdWeapon() {
  const w = CMD_WEAPONS[S.wpnIdx];
  const dmgMul = 1 + bLv('cmdDmg') * 0.20;
  const magMul = 1 + bLv('cmdDmg') * 0.10;
  return Object.assign({}, w, {
    dmg: w.dmg * dmgMul,
    mag: Math.round(w.mag * magMul)
  });
}

function makeFighter(side, def, x, hpMul = 1) {
  let hp, dmg, heal = 0, shield = 0;
  if (side === 'p') {
    const st = getUnitStats(def);
    hp = st.hp; dmg = st.dmg; heal = st.heal; shield = st.shield;
  } else {
    hp = Math.round(def.hp * hpMul);
    dmg = def.dmg * (1 + (hpMul - 1) * 0.55);
    heal = def.heal ? def.heal * hpMul : 0;
    shield = def.shield ? Math.round(def.shield * hpMul) : 0;
  }
  return {
    side, def, x, y: GY + rand(-16, 14),
    hp, maxHp: hp, shield, maxShield: Math.max(shield, 1),
    dmg, heal, cd: rand(0, .25), anim: rand(0, 5),
    moving: true, kb: 0, kbStep: hp / ((def.kb || 0) + 1), nextKb: hp - hp / ((def.kb || 0) + 1),
    flash: 0, wind: 0, recoil: 0, hop: 0
  };
}

function startStage(i) {
  const st = STAGES[i];
  const baseMax = 3000 + bLv('baseHp') * 600;
  const startEn = 120 + bLv('economy') * 35;
  S.wpnIdx = 0;
  const wpn = getCmdWeapon();
  Object.assign(S, {
    mode: 'play', si: i, stage: st, t: 0,
    energy: startEn, wallet: 1,
    baseMax, baseHp: baseMax,
    hiveMax: st.hive, hiveHp: st.hive,
    units: [], enemies: [], proj: [], parts: [], tracers: [], texts: [], hitMarks: [],
    cds: UNITS.map(() => 0),
    burst: 0, burstSeq: null, fullT: 0,
    ammo: wpn.mag, reloadT: 0, fireCd: 0, firing: false, skillCd: 0,
    shake: 0, flash: 0,
    kills: 0, cores: 0, deployed: 0, earnedCr: 0,
    bossSpawned: false, paused: false, ending: null,
    wave: 1, waveT: 0,
    spawners: st.spawns.map(([type, next, iv]) => ({ type, next, iv })),
    pendingSpawns: [],
  });
  S.autoAll = false; S.autoUnit.fill(false);
  $('autoBtn').classList.remove('on');
  ubtns.forEach(u => u.b.classList.remove('auto-on'));
  const track = st.bgm || BGM_DEFAULT;
  if (bgm.getAttribute('src') !== track) bgm.src = track;
  bgm.currentTime = 0;
  showOnly(null);
  banner(st.endless ? 'ENDLESS START' : 'MISSION START', st.name);
}

function spawnEnemy(type, mul = 1) {
  const waveMul = S.stage.endless ? Math.pow(1.18, S.wave - 1) : 1;
  S.enemies.push(makeFighter('e', ENEMIES[type], HIVE_FRONT - 4, S.stage.hpMul * mul * waveMul));
}

function deploy(i, silent = false) {
  if (S.mode !== 'play' || S.paused || S.ending) return;
  const d = UNITS[i], st = getUnitStats(d);
  if (S.energy < d.cost || S.cds[i] > 0 || S.units.length >= 40) { if (!silent) sfx('deny'); return; }
  S.energy -= d.cost; S.cds[i] = st.cd; S.deployed++;
  S.units.push(makeFighter('p', d, BASE_FRONT + 2));
  spark(BASE_FRONT + 4, GY - 20, '#38dcff', 8, 100);
  if (!silent) sfx('deploy');
}

function upgradeWallet() {
  if (S.mode !== 'play' || S.paused) return;
  const c = walletCost(S.wallet);
  if (S.energy < c) { sfx('deny'); return; }
  S.energy -= c; S.wallet++; sfx('deploy');
  floatText(200, 120, `WALLET Lv${S.wallet}`, '#ffc83d', 18);
}

function switchWeapon() {
  if (S.mode !== 'play' || S.paused) return;
  S.wpnIdx = (S.wpnIdx + 1) % CMD_WEAPONS.length;
  const w = getCmdWeapon();
  S.ammo = w.mag; S.reloadT = 0;
  sfx('deploy');
  floatText(S.aim.x, S.aim.y - 24, w.name, w.col, 15);
}

function triggerSkill() {
  if (S.mode !== 'play' || S.paused || S.ending || S.skillCd > 0) return;
  S.skillCd = 18;
  sfx('burst');
  banner('TACTICAL SUPPORT', '全味方シールド付与 ＆ 戦術空爆', '#4dffb8', 1.2);
  for (const u of S.units) {
    u.shield = Math.max(u.shield || 0, Math.round(u.maxHp * 0.35));
    u.maxShield = Math.max(u.maxShield, u.shield);
    u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.2);
    spark(u.x, u.y - 25, '#4dffb8', 6, 90);
  }
  const dmg = (140 + bLv('cmdDmg') * 28) * S.stage.hpMul;
  for (let i = 0; i < 4; i++) {
    const tx = 260 + i * 155;
    S.proj.push({ x: tx - 60, y: -20, tx, ty: GY - 10, sp: 650, dmg, r: 95, side: 'p', col: '#4dffb8' });
  }
}

function reload() {
  const w = getCmdWeapon();
  if (S.mode === 'play' && S.reloadT <= 0 && S.ammo < w.mag && S.fullT <= 0) S.reloadT = w.reload;
}
function triggerBurst() {
  if (S.mode !== 'play' || S.paused || S.burst < 100 || S.burstSeq || S.fullT > 0) return;
  S.burst = 0; S.burstSeq = { t: 0, step: 0 }; sfx('burst');
}
const dmgMult = () => S.fullT > 0 ? 1.5 : 1;
const burstGainMult = () => 1 + bLv('burst') * 0.15;

function hurt(o, dmg, src, forceKb = false) {
  if (o.dead) return;
  if (o.shield && o.shield > 0) {
    const absorb = Math.min(o.shield, dmg);
    o.shield -= absorb;
    dmg -= absorb;
    spark(o.x, bodyY(o) - 20, '#7ea8ff', 3, 70);
  }
  o.hp -= dmg; o.flash = .07;
  if (o.side === 'e' && src === 'unit' && !S.burstSeq && S.fullT <= 0) {
    S.burst = Math.min(100, S.burst + dmg * .025 * burstGainMult());
  }
  if (dmg >= 80 && src !== 'cmd') floatText(o.x + rand(-6, 6), bodyY(o) - o.def.h - 6, Math.round(dmg), o.side === 'e' ? '#fff' : '#ff8a96', 13);
  if (o.hp > 0 && (o.hp <= o.nextKb || forceKb)) {
    o.kb = .28;
    if (o.hp <= o.nextKb) o.nextKb -= o.kbStep;
  }
  if (o.hp <= 0) {
    o.dead = true;
    if (o.side === 'e') {
      S.kills++;
      S.energy = Math.min(walletCap(S.wallet), S.energy + o.def.reward);
      const cr = o.def.cr || 1;
      S.earnedCr += cr; save.credits += cr;
      if (o.def.id === 'boss' || o.def.id === 'empress') {
        boom(o.x, bodyY(o) - 80, 120); boom(o.x - 40, bodyY(o) - 40, 80);
      } else {
        boom(o.x, bodyY(o) - o.def.h / 2, o.def.id === 'tank' ? 60 : 26);
      }
      floatText(o.x, bodyY(o) - o.def.h - 14, `+${o.def.reward}⚡`, '#38dcff', 13);
    } else spark(o.x, o.y - 20, '#9fdcff', 14, 140);
  }
}

function hurtBase(toHive, dmg, x, y) {
  if (S.ending) return;
  if (toHive) {
    if (!S.stage.endless) S.hiveHp -= dmg;
    if (!S.burstSeq && S.fullT <= 0) S.burst = Math.min(100, S.burst + dmg * .012 * burstGainMult());
  } else {
    S.baseHp -= dmg; S.shake = Math.max(S.shake, 2);
  }
  if (Math.random() < .5) spark(x, y, toHive ? '#ff8a96' : '#9fdcff', 3, 90);
}

function updateFighter(f, foes, allies, dir, dt) {
  const d = f.def;
  f.anim += dt; f.flash -= dt; f.recoil = Math.max(0, f.recoil - dt * 40);
  if (f.kb > 0) { f.kb -= dt; f.x -= dir * 135 * dt; f.hop = Math.sin((1 - f.kb / .28) * Math.PI) * 13; f.x = clamp(f.x, BASE_FRONT, HIVE_FRONT); return; }
  f.hop = 0;

  // Medic / Healer periodic pulse
  if (f.heal > 0 && f.cd <= 0) {
    let wounded = null;
    for (const a of allies) {
      if (!a.dead && a.hp < a.maxHp && Math.abs(a.x - f.x) <= d.range) {
        if (!wounded || (a.hp / a.maxHp) < (wounded.hp / wounded.maxHp)) wounded = a;
      }
    }
    if (wounded) {
      f.cd = d.rate; f.moving = false;
      for (const a of allies) {
        if (!a.dead && a.hp < a.maxHp && Math.abs(a.x - f.x) <= d.range) {
          a.hp = Math.min(a.maxHp, a.hp + f.heal);
          spark(a.x, bodyY(a) - 20, '#4dffb8', 5, 70);
        }
      }
      S.parts.push({ x: f.x, y: bodyY(f) - 18, ring: true, r: 6, R: 65, life: .3, max: .3, col: '#4dffb8' });
      return;
    }
  }

  let best = null, bd = 1e9;
  for (const o of foes) {
    if (o.dead) continue;
    const dx = (o.x - f.x) * dir, reach = d.range + o.def.w / 2;
    if (dx > -18 && dx <= reach && dx < bd) { bd = dx; best = o; }
  }
  const baseDx = dir > 0 ? HIVE_FRONT - f.x : f.x - BASE_FRONT;
  const hitBase = !best && baseDx <= Math.max(d.range, 30);
  f.cd -= dt;
  if (best || hitBase) {
    f.moving = false;
    if (d.windup) { f.wind = Math.min(d.windup, f.wind + dt); f.spin = (f.spin || 0) + dt * 30; if (f.wind < d.windup) return; }
    if (f.cd <= 0) { f.cd = d.rate; attack(f, best, dir); }
  } else {
    f.moving = true; f.wind = Math.max(0, f.wind - dt);
    f.x += dir * d.speed * dt;
    f.x = clamp(f.x, BASE_FRONT, HIVE_FRONT);
  }
}

function attack(f, tgt, dir) {
  const d = f.def, mult = f.side === 'p' ? dmgMult() : 1;
  const toHive = dir > 0;
  const tp = tgt ? { x: tgt.x + rand(-4, 4), y: bodyY(tgt) - tgt.def.h * .5 + rand(-5, 5) }
                 : (toHive ? { x: HIVE_FRONT + rand(10, 50), y: rand(240, GY - 20) } : { x: BASE_FRONT - rand(4, 30), y: rand(220, GY - 20) });
  f.recoil = d.id === 'rl' || d.id === 'sr' ? 6 : 2;
  if (d.explode) {
    boom(f.x, f.y - 15, d.explode);
    for (const u of S.units) if (Math.abs(u.x - f.x) < d.explode) hurt(u, f.dmg, 'enemy');
    if (f.x - BASE_FRONT < d.explode) hurtBase(false, f.dmg, BASE_FRONT, GY - 40);
    f.dead = true; f.hp = 0;
    return;
  }
  if (d.melee) {
    spark(tp.x, tp.y, f.side === 'p' ? '#7ea8ff' : '#ff6b7a', 4, 80);
    if (tgt) hurt(tgt, f.dmg * mult, f.side === 'p' ? 'unit' : 'enemy');
    else hurtBase(toHive, f.dmg * mult, tp.x, tp.y);
    f.x += dir * 4; return;
  }
  const m = f.side === 'p' ? muzzle(f) : { x: f.x - f.def.w / 2 - 6, y: bodyY(f) - f.def.h * .75 };
  if (d.splash) {
    S.proj.push({ x: m.x, y: m.y, tx: tp.x, ty: tp.y, sp: f.side === 'p' ? 520 : 320, dmg: f.dmg * mult, r: d.splash, side: f.side, col: f.side === 'p' ? '#ffb347' : '#ff3b52' });
    return;
  }
  const col = f.side === 'p' ? (d.id === 'sr' ? '#ffffff' : d.acc) : (d.laser ? '#ff2b44' : '#ff4d5e');
  const w = d.id === 'sr' || d.laser ? 2.8 : 1.4;
  S.tracers.push({ x1: m.x, y1: m.y, x2: tp.x, y2: tp.y, life: d.id === 'sr' || d.laser ? .2 : .06, max: d.id === 'sr' || d.laser ? .2 : .06, col, w });
  S.parts.push({ x: m.x, y: m.y, vx: 0, vy: 0, life: .05, max: .05, col: '#fff2b0', size: d.id === 'mg' ? 5 : 4 });
  const pellets = d.pellets || 1;
  for (let i = 1; i < pellets; i++) S.tracers.push({ x1: m.x, y1: m.y, x2: tp.x + rand(-6, 6), y2: tp.y + rand(-14, 14), life: .06, max: .06, col, w: 1 });
  const dmg = f.dmg * pellets * mult;
  if (tgt) { hurt(tgt, dmg, f.side === 'p' ? 'unit' : 'enemy'); if (Math.random() < .4) spark(tp.x, tp.y, f.side === 'p' ? '#ffd27a' : '#ff8a96', 2, 80); }
  else hurtBase(toHive, dmg, tp.x, tp.y);
}

function commanderFire() {
  const wpn = getCmdWeapon();
  S.fireCd = wpn.rate;
  if (S.fullT <= 0) S.ammo--;
  const mult = dmgMult();
  sfx(wpn.id === 'lzr' ? 'laser' : 'shot');
  S.shake = Math.max(S.shake, wpn.id === 'sg' ? 2.2 : 1.0);

  const sorted = S.enemies.filter(e => !e.dead).sort((a, b) => b.y - a.y);

  for (let p = 0; p < wpn.pellets; p++) {
    const px = S.aim.x + rand(-wpn.spread, wpn.spread);
    const py = S.aim.y + rand(-wpn.spread, wpn.spread);
    S.tracers.push({
      x1: W / 2 + (px - W / 2) * .2, y1: H + 10, x2: px, y2: py,
      life: wpn.id === 'lzr' ? .14 : .06, max: wpn.id === 'lzr' ? .14 : .06,
      col: wpn.col, w: wpn.id === 'lzr' ? 3.5 : 2
    });

    const hits = [];
    for (const e of sorted) {
      const by = bodyY(e), hw = e.def.w / 2 + 5;
      if (px >= e.x - hw && px <= e.x + hw && py >= by - e.def.h - 6 && py <= by + 4) {
        hits.push(e);
        if (!wpn.pierce) break;
      }
    }

    if (hits.length > 0) {
      for (const hit of hits) {
        const c = coreOf(hit), core = Math.hypot(px - c.x, py - c.y) <= c.r + 5;
        const dmg = wpn.dmg * mult * (core ? wpn.coreMul : 1);
        hurt(hit, dmg, 'cmd', wpn.kb && p === 0);
        if (core) S.cores++;
        if (!S.burstSeq && S.fullT <= 0) S.burst = Math.min(100, S.burst + dmg * .085 * burstGainMult());
        spark(px, py, core ? '#ff3b52' : '#ffe08a', core ? 6 : 3, 120);
        addHitMark(px, py, core);
        if (core) floatText(px + rand(-6, 6), py - 12, `CORE ${Math.round(dmg)}`, '#ff5d70', 16);
      }
    } else if (px > HIVE_FRONT && py > 150 && py < GY + 8) {
      const core = Math.hypot(px - 900, py - 290) <= 24;
      const dmg = wpn.dmg * mult * (core ? 1.6 : .6);
      hurtBase(true, dmg, px, py);
      addHitMark(px, py, core);
      if (core && p === 0) floatText(px, py - 10, `CORE ${Math.round(dmg)}`, '#ff5d70', 15);
    } else if (p === 0) {
      spark(px, py, '#c9c3b8', 2, 60);
    }
  }
  if (S.ammo <= 0 && S.fullT <= 0) S.reloadT = wpn.reload;
}

function update(dt) {
  S.t += dt;
  for (const p of S.parts) { p.life -= dt; if (p.ring) p.r += (p.R - p.r) * Math.min(1, dt * 14); else { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; } }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.tracers) t.life -= dt;
  S.tracers = S.tracers.filter(t => t.life > 0);
  for (const t of S.texts) { t.life -= dt; t.y -= 34 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const m of S.hitMarks) m.life -= dt;
  S.hitMarks = S.hitMarks.filter(m => m.life > 0);
  S.shake = Math.max(0, S.shake - dt * 18); S.flash = Math.max(0, S.flash - dt * 2.5);
  if (S.banner) { S.banner.t += dt; if (S.banner.t > S.banner.dur) S.banner = null; }
  if (S.mode !== 'play') return;

  if (S.ending) {
    S.ending.t += dt;
    for (const e of S.enemies) e.anim += dt;
    if (S.ending.win && Math.random() < .3) boom(rand(HIVE_FRONT, W), rand(170, GY), rand(30, 70));
    if (S.ending.t > 1.8) showResult();
    return;
  }

  // Economy & Cooldowns
  S.energy = Math.min(walletCap(S.wallet), S.energy + walletRate(S.wallet) * dt);
  S.cds = S.cds.map(c => Math.max(0, c - dt));
  S.skillCd = Math.max(0, S.skillCd - dt);

  // Auto-deploy check
  if (S.autoAll || S.autoUnit.some(Boolean)) {
    for (let i = 0; i < UNITS.length; i++) {
      if ((S.autoAll || S.autoUnit[i]) && S.cds[i] <= 0 && S.energy >= UNITS[i].cost && S.units.length < 40) {
        deploy(i, true);
      }
    }
  }

  // Endless Wave Progression
  if (S.stage.endless) {
    S.waveT += dt;
    if (S.waveT >= 30) {
      S.waveT = 0; S.wave++;
      save.bestWave = Math.max(save.bestWave, S.wave);
      const bonus = 15 + S.wave * 5;
      S.earnedCr += bonus; save.credits += bonus; writeSave();
      if (S.wave % 3 === 0) {
        spawnEnemy(S.wave % 6 === 0 ? 'empress' : 'boss', 0.7 + S.wave * 0.15);
        banner(`WAVE ${S.wave} BOSS`, `大型個体出現！ (+${bonus}💎)`, '#ff3b52', 2.0);
      } else {
        banner(`WAVE ${S.wave}`, `敵勢力が強化 (+${bonus}💎)`, '#d48dff', 1.5);
      }
    }
  }

  // Spawning
  const ramp = Math.max(.48, 1 - S.t / 380);
  for (const sp of S.spawners) if (S.t >= sp.next) { spawnEnemy(sp.type); sp.next += sp.iv * ramp * rand(.85, 1.15); }
  if (S.pendingSpawns.length) S.pendingSpawns = S.pendingSpawns.filter(p => S.t >= p.at ? (spawnEnemy(p.type), false) : true);
  if (!S.stage.endless && !S.bossSpawned && S.hiveHp <= S.hiveMax * .6) {
    S.bossSpawned = true;
    spawnEnemy(S.stage.bossType || 'boss', S.stage.bossMul);
    for (let i = 0; i < 3; i++) S.pendingSpawns.push({ at: S.t + .6 + i * .5, type: 'grunt' });
    banner('WARNING', '大型ラプチャー接近！赤いコアを狙え', '#ff3b52', 2.2); S.shake = 8;
  }

  // Commander Weapon
  const wpn = getCmdWeapon();
  S.fireCd -= dt;
  if (S.reloadT > 0) { S.reloadT -= dt; if (S.reloadT <= 0) S.ammo = wpn.mag; }
  else if (S.firing && S.fireCd <= 0 && (S.ammo > 0 || S.fullT > 0)) commanderFire();

  // Burst Sequence
  if (S.burstSeq) {
    const b = S.burstSeq; b.t += dt;
    if (b.step === 0) {
      b.step = 1; banner('BURST I', '修復＆シールド展開', '#4dffb8', .85);
      for (const u of S.units) { u.hp = Math.min(u.maxHp, u.hp + u.maxHp * .45); u.shield = Math.max(u.shield || 0, 80); }
      S.baseHp = Math.min(S.baseMax, S.baseHp + S.baseMax * .10);
    }
    if (b.step === 1 && b.t > .65) { b.step = 2; banner('BURST II', '全部隊 火力オーバードライブ', '#38dcff', .85); sfx('burst'); }
    if (b.step === 2 && b.t > 1.3) {
      b.step = 3; banner('BURST III', '軌道サテライト砲撃', '#ffc83d', 1.0); sfx('burst');
      S.flash = 1; S.shake = 12;
      const bDmg = (280 + bLv('cmdDmg') * 35) * S.stage.hpMul;
      for (const e of S.enemies) { hurt(e, bDmg, 'burst'); S.tracers.push({ x1: e.x, y1: -10, x2: e.x, y2: e.y, life: .5, max: .5, col: '#ffe9a8', w: 14 }); }
      hurtBase(true, 180, 890, 300);
    }
    if (b.step === 3 && b.t > 2.0) {
      S.burstSeq = null;
      S.fullT = 10 + bLv('burst');
      S.reloadT = 0; S.ammo = wpn.mag;
      banner('FULL BURST', `${S.fullT}秒間 火力1.5倍・弾数無制限`, '#ffc83d', 1.4);
    }
  }
  if (S.fullT > 0) S.fullT -= dt;

  for (const u of S.units) updateFighter(u, S.enemies, S.units, 1, dt);
  for (const e of S.enemies) updateFighter(e, S.units, S.enemies, -1, dt);

  for (const p of S.proj) {
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy), step = p.sp * dt;
    if (dist <= step) {
      p.done = true; boom(p.tx, p.ty, p.r * .65);
      const foes = p.side === 'p' ? S.enemies : S.units;
      for (const o of foes) if (Math.abs(o.x - p.tx) < p.r && !o.dead) hurt(o, p.dmg, p.side === 'p' ? 'unit' : 'enemy');
      if (p.side === 'p' && p.tx + p.r > HIVE_FRONT) hurtBase(true, p.dmg, p.tx, p.ty);
      if (p.side === 'e' && p.tx - p.r < BASE_FRONT) hurtBase(false, p.dmg, p.tx, p.ty);
    } else { p.x += dx / dist * step; p.y += dy / dist * step; }
  }
  S.proj = S.proj.filter(p => !p.done);
  S.units = S.units.filter(u => !u.dead);
  S.enemies = S.enemies.filter(e => !e.dead);

  if (!S.stage.endless && S.hiveHp <= 0) {
    const star = S.baseHp / S.baseMax > .66 ? 3 : S.baseHp / S.baseMax > .33 ? 2 : 1;
    S.hiveHp = 0; S.ending = { win: true, t: 0, star }; S.firing = false;
    for (const e of S.enemies) boom(e.x, bodyY(e) - 20, 40); S.enemies = [];
    const first = !save.cleared[S.si];
    save.cleared[S.si] = Math.max(save.cleared[S.si] || 0, star);
    const rewardCr = S.stage.clearCr + (first ? 50 : 0);
    S.earnedCr += rewardCr; save.credits += rewardCr; writeSave();
    banner('STAGE CLEAR', `ハイヴ破壊！ 報酬 +${rewardCr}💎`, '#38dcff', 2);
  } else if (S.baseHp <= 0) {
    S.baseHp = 0; S.ending = { win: false, t: 0 }; S.firing = false;
    writeSave();
    boom(60, 300, 120); banner(S.stage.endless ? `WAVE ${S.wave} 終了` : 'DEFEAT', 'アーク防衛線 突破', '#ff3b52', 2);
  }
}

/* ---------------- Render Canvas ---------------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = S.shake ? rand(-S.shake, S.shake) : 0, sy = S.shake ? rand(-S.shake, S.shake) : 0;
  ctx.save(); ctx.translate(sx, sy);
  ctx.drawImage(bg, -12, -12, W + 24, H + 24);
  drawHive();
  if (S.mode === 'play') {
    drawBase();
    const all = S.units.concat(S.enemies).sort((a, b) => a.y - b.y);
    for (const f of all) {
      if (f.side === 'p') {
        drawGirl(ctx, f);
        if (f.hp < f.maxHp || f.shield > 0) hpBar(f.x, f.y - 58, 26, f.hp / f.maxHp, '#38dcff', (f.shield || 0) / f.maxShield);
        if (f.def.windup && f.wind > 0 && f.wind < f.def.windup) hpBar(f.x, f.y - 64, 24, f.wind / f.def.windup, '#7dffcf');
      } else {
        drawEnemy(f);
        if (f.hp < f.maxHp || f.shield > 0 || f.def.id === 'boss' || f.def.id === 'empress') {
          hpBar(f.x, bodyY(f) - f.def.h - 12, Math.min(Math.max(f.def.w, 32), 110), f.hp / f.maxHp, '#ff3b52', (f.shield || 0) / f.maxShield);
        }
      }
    }
    for (const p of S.proj) {
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.side === 'p' ? 5 : 7, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
    }
  } else drawBase();

  ctx.lineCap = 'round';
  for (const t of S.tracers) {
    ctx.globalAlpha = t.life / t.max; ctx.strokeStyle = t.col; ctx.lineWidth = t.w;
    ctx.beginPath(); ctx.moveTo(t.x1, t.y1); ctx.lineTo(t.x2, t.y2); ctx.stroke();
  }
  for (const p of S.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.ring) { ctx.strokeStyle = p.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
    else { ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of S.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.font = `700 ${t.size}px "Chakra Petch", monospace`;
    ctx.fillStyle = 'rgba(0,0,0,.78)'; ctx.fillText(t.txt, t.x + 1.5, t.y + 1.5);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (S.fullT > 0) {
    ctx.strokeStyle = `rgba(255,200,61,${.4 + Math.sin(S.t * 8) * .2})`;
    ctx.lineWidth = 6; ctx.strokeRect(3, 3, W - 6, H - 6);
  }
  if (S.mode === 'play') drawCanvasHud();
  if (S.flash > 0) { ctx.fillStyle = `rgba(255,244,214,${S.flash * .8})`; ctx.fillRect(0, 0, W, H); }
  if (S.banner) drawBanner();
  if (S.mode === 'play' && S.aim.on && !S.ending && !S.paused) drawCrosshair();
}

function drawCanvasHud() {
  // Compact ammo box (bottom right)
  const wpn = getCmdWeapon();
  const bw = 132, bh = 38, bx = W - bw - 12, by = H - bh - 12;
  const col = S.fullT > 0 ? '#ffc83d' : S.reloadT > 0 ? '#ff3b52' : wpn.col;
  ctx.fillStyle = 'rgba(10,14,22,.8)';
  ctx.strokeStyle = S.fullT > 0 || S.reloadT > 0 ? col : '#334260';
  ctx.lineWidth = 1.5;
  rr(ctx, bx, by, bw, bh, 7); ctx.fill(); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = '700 11px "Chakra Petch", monospace';
  ctx.fillStyle = wpn.col;
  ctx.fillText(wpn.short, bx + 10, by + 17);
  ctx.textAlign = 'right';
  ctx.font = '700 18px "Chakra Petch", monospace';
  ctx.fillStyle = S.fullT > 0 ? '#ffc83d' : S.reloadT > 0 ? '#ff5d70' : '#f2f6ff';
  ctx.fillText(S.fullT > 0 ? '∞' : S.reloadT > 0 ? 'RELOAD' : `${S.ammo}/${wpn.mag}`, bx + bw - 10, by + 19);

  const frac = S.reloadT > 0 ? 1 - S.reloadT / wpn.reload : S.fullT > 0 ? 1 : S.ammo / wpn.mag;
  ctx.fillStyle = '#192234';
  ctx.fillRect(bx + 10, by + 26, bw - 20, 5);
  ctx.fillStyle = col;
  ctx.fillRect(bx + 10, by + 26, (bw - 20) * clamp(frac, 0, 1), 5);
}

function drawCrosshair() {
  const { x, y } = S.aim, wpn = getCmdWeapon();
  const col = S.fullT > 0 ? '#ffc83d' : wpn.col;

  // Hit markers
  for (const m of S.hitMarks) {
    ctx.save();
    ctx.globalAlpha = m.life / m.max;
    ctx.strokeStyle = m.crit ? '#ff3b52' : '#ffffff';
    ctx.lineWidth = m.crit ? 3 : 2;
    const d = m.crit ? 12 : 8;
    ctx.beginPath();
    ctx.moveTo(m.x - d, m.y - d); ctx.lineTo(m.x + d, m.y + d);
    ctx.moveTo(m.x + d, m.y - d); ctx.lineTo(m.x - d, m.y + d);
    ctx.stroke();
    ctx.restore();
  }

  // Outer dark shadow ring for contrast on any background
  ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.stroke();

  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.stroke();
  for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    ctx.beginPath(); ctx.moveTo(x + a * 9, y + b * 9); ctx.lineTo(x + a * 23, y + b * 23); ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, TAU); ctx.fill();

  // Ammo / Reload ring around crosshair
  const frac = S.reloadT > 0 ? 1 - S.reloadT / wpn.reload : S.fullT > 0 ? 1 : S.ammo / wpn.mag;
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = S.reloadT > 0 ? '#ff3b52' : col;
  ctx.beginPath(); ctx.arc(x, y, 26, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  if (S.reloadT > 0) {
    ctx.font = '700 11px "Chakra Petch", monospace';
    ctx.fillStyle = '#ff8a96'; ctx.textAlign = 'center';
    ctx.fillText('RELOAD', x, y + 40);
  }
}

function drawBanner() {
  const b = S.banner, k = b.t / b.dur, a = k < .15 ? k / .15 : k > .8 ? (1 - k) / .2 : 1;
  const slide = k < .15 ? (1 - k / .15) * 80 : 0;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,10,16,.84)'; poly(ctx, [0, 215, W, 195, W, 305, 0, 325]); ctx.fill();
  ctx.fillStyle = b.col; poly(ctx, [0, 215, W, 195, W, 200, 0, 220]); ctx.fill(); poly(ctx, [0, 320, W, 300, W, 305, 0, 325]); ctx.fill();
  ctx.textAlign = 'center'; ctx.fillStyle = b.col;
  ctx.font = '400 46px "Dela Gothic One", sans-serif'; ctx.fillText(b.text, W / 2 + slide, 268);
  ctx.font = '700 17px "Zen Kaku Gothic New", sans-serif'; ctx.fillStyle = '#f2f6ff'; ctx.fillText(b.sub, W / 2 - slide, 298);
  ctx.restore();
}

// Card tooltip carries the details (level, role, stats) that no longer fit on the card itself

function buildUnitButtons() {
  unitsEl.innerHTML = '';
  ubtns.length = 0;
  UNITS.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'ub'; b.type = 'button';
    b.title = unitTitle(d);
    const clsMod = d.id === 'med' ? 'med' : d.id === 'shd' ? 'shd' : '';
    b.innerHTML = `
      <span class="cl ${clsMod}">${d.cls}</span>
      <span class="k">${d.key}</span>
      <canvas width="96" height="96"></canvas>
      <span class="nm">${d.name}</span>
      <span class="cost">⚡${d.cost}</span>
      <i class="cdv"></i>
      <span class="cdt" hidden></span>`;
    const pc = b.querySelector('canvas').getContext('2d');
    pc.scale(1.85, 1.85);
    drawGirl(pc, { def: d, x: 24, y: 50, anim: 0, moving: false }, 1.05);
    // AUTO toggle: right-click, or long-press on touch. lpDone suppresses the click that follows a long-press
    // and stops a long-press from toggling twice when the browser also fires contextmenu.
    let lpTimer = 0, lpDone = false;
    const toggleAuto = () => {
      S.autoUnit[i] = !S.autoUnit[i];
      b.classList.toggle('auto-on', S.autoUnit[i] || S.autoAll);
      sfx('deploy');
    };
    const cancelLp = () => { clearTimeout(lpTimer); lpTimer = 0; };
    let lastType = 'mouse';
    b.addEventListener('pointerdown', ev => {
      lpDone = false; cancelLp(); lastType = ev.pointerType;
      if (ev.button !== 0) return;
      lpTimer = setTimeout(() => { lpTimer = 0; lpDone = true; toggleAuto(); }, 500);
    });
    b.addEventListener('pointerup', cancelLp);
    b.addEventListener('pointerleave', cancelLp);
    b.addEventListener('pointercancel', cancelLp);
    b.addEventListener('click', () => { if (lpDone) { lpDone = false; return; } initAudio(); deploy(i); });
    b.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if (lpDone) return;
      cancelLp(); lpDone = lastType !== 'mouse'; toggleAuto();
    });
    unitsEl.appendChild(b);
    ubtns.push({ b, cdt: b.querySelector('.cdt'), last: '' });
  });
}

try {

function setPause(p) {
  if (S.mode !== 'play' || S.ending) return;
  S.paused = p; S.firing = false; showOnly(p ? 'pause' : null);
  if (p) { disarmRetreat(); writeSave(); }
}

let dockCache = {};
function setIf(key, val, fn) { if (dockCache[key] !== val) { dockCache[key] = val; fn(val); } }

function syncDock() {
  const play = S.mode === 'play';
  const en = play ? Math.floor(S.energy) : 0, cap = play ? walletCap(S.wallet) : 320;
  const rate = play ? Math.round(walletRate(S.wallet)) : Math.round(walletRate(1));
  setIf('en', en, v => $('en').textContent = v);
  setIf('cap', cap, v => $('encap').textContent = '/ ' + v);
  setIf('rate', rate, v => $('enRate').textContent = `+${v}/s`);
  setIf('fill', cap ? Math.round(en / cap * 200) : 0, v => $('enfill').style.width = v / 2 + '%');

  const wc = play ? walletCost(S.wallet) : 60;
  setIf('wlv', play ? S.wallet : 1, v => $('wlv').textContent = v);
  setIf('wc', wc, v => $('wcost').textContent = v === Infinity ? 'MAX' : '⚡' + v);
  setIf('wd', !play || en < wc, v => $('walletBtn').disabled = v);

  // Topbar sync
  const bHp = play ? Math.max(0, Math.ceil(S.baseHp)) : 3000 + bLv('baseHp') * 600;
  const bMax = play ? S.baseMax : bHp;
  setIf('tbh', `${bHp} / ${bMax}`, v => $('topBaseHp').textContent = v);
  setIf('tbb', Math.round(bHp / bMax * 100), v => $('topBaseBar').style.width = v + '%');

  if (play && S.stage?.endless) {
    setIf('thTitle', 'ENDLESS', v => $('topHiveTitle').innerHTML = `${v}<i class="dot"></i>`);
    setIf('thh', `WAVE ${S.wave}`, v => $('topHiveHp').textContent = v);
    setIf('thb', Math.round((1 - S.waveT / 30) * 100), v => $('topHiveBar').style.width = v + '%');
    setIf('bmark', true, () => $('bossMark').hidden = true);
  } else {
    const hHp = play ? Math.max(0, Math.ceil(S.hiveHp)) : 2600;
    const hMax = play ? S.hiveMax : 2600;
    setIf('thTitle', 'RAPTURE HIVE', v => $('topHiveTitle').innerHTML = `${v}<i class="dot"></i>`);
    setIf('thh', `${hHp} / ${hMax}`, v => $('topHiveHp').textContent = v);
    setIf('thb', Math.round(hHp / hMax * 100), v => $('topHiveBar').style.width = v + '%');
    setIf('bmark', false, () => $('bossMark').hidden = false);
  }

  const m = Math.floor(S.t / 60), s = Math.floor(S.t % 60);
  setIf('ttime', play ? `${m}:${String(s).padStart(2, '0')}` : '0:00', v => $('topTime').textContent = v);
  setIf('tstg', play ? S.stage.name : 'STANDBY', v => $('topStageLbl').textContent = v);
  setIf('tunits', `${S.units.length} / 40`, v => $('topUnits').textContent = v);

  // Units sync
  UNITS.forEach((d, i) => {
    const st = getUnitStats(d);
    const cd = play ? S.cds[i] : 0;
    const cdf = play ? cd / st.cd : 0, ok = play && en >= d.cost && S.units.length < 40;
    const cdTxt = cd > 0 ? cd.toFixed(1) + 's' : '';
    const key = (ok && cdf <= 0 ? 'ready' : ok ? '' : 'off') + '|' + Math.round(cdf * 100) + '|' + cdTxt;
    if (ubtns[i].last !== key) {
      ubtns[i].last = key;
      const u = ubtns[i];
      u.b.classList.toggle('ready', ok && cdf <= 0);
      u.b.classList.toggle('off', !ok && cdf <= 0);
      u.b.style.setProperty('--cd', cdf.toFixed(2));
      u.cdt.hidden = cd <= 0;
      if (cd > 0) u.cdt.textContent = cdTxt;
    }
  });

  // Weapon & Skill sync
  const wpn = getCmdWeapon();
  setIf('wpn', wpn.name.replace(/^\S+\s/, ''), v => $('wpnName').textContent = v);
  const sk = play ? Math.ceil(S.skillCd) : 0;
  setIf('sk', sk, v => {
    $('skillCd').hidden = v <= 0;
    if (v > 0) $('skillCd').textContent = v + 's';
  });

  // Burst sync
  const g = play ? S.burst / 100 : 0, full = play && S.burst >= 100 && !S.burstSeq && S.fullT <= 0;
  setIf('g', Math.round(g * 100), v => $('burstBtn').style.setProperty('--g', v / 100));
  setIf('full', full, v => $('burstBtn').classList.toggle('full', v));
  const bl = !play ? 'BURST 0%' : S.fullT > 0 ? `FULL BURST ${Math.ceil(S.fullT)}s` : S.burstSeq ? 'BURSTING…' : full ? '★ BURST 発動' : `BURST ${Math.floor(S.burst)}%`;
  setIf('bl', bl, v => $('burstBtn').querySelector('span').textContent = v);
}

/* ---------------- Overlays (Menu, Upgrade, Result) ---------------- */
function showOnly(id) { for (const k of ['menu', 'upgrade', 'result', 'pause']) $(k).hidden = k !== id; syncBgm(); }

  const unlocked = i => i === 0 || !!save.cleared[i - 1];

    if (s.endless) return save.bestWave ? `BEST WAVE ${save.bestWave}` : '';

    </div>

        </div>
        <span class="nm">${s.name}</span>

function showUpgrade(returnTo = 'menu') {
  S.mode = 'upgrade';
  const renderUpg = () => {
    $('upgrade').innerHTML = `
      <div class="upg-wrap">
        <div class="menu-top-bar">
          <div class="tag">SQUAD & ARK UPGRADE LAB · 部隊強化ラボ</div>
          <div class="credit-badge">所持コア: 💎 ${save.credits}</div>
          <div style="display:flex;gap:.8cqw">
            <button class="btn" id="resetUpgBtn" style="font-size:max(11px,1.2cqw);padding:.45cqw 1cqw">強化リセット(全額返還)</button>
            <button class="btn pri" id="closeUpgBtn" style="font-size:max(11px,1.3cqw);padding:.45cqw 1.4cqw">戻る</button>
          </div>
        </div>
        <h3 class="upg-sec-title">■ スクワッド強化（HP・攻撃力・回復量 +16%/Lv、再出撃短縮）</h3>
        <div class="upg-grid">
          ${UNITS.map(u => {
            const lv = uLv(u.id), cost = unitUpgradeCost(u.id), st = getUnitStats(u);
            return `
              <div class="upg-card">
                <div class="top"><span class="nm">[${u.cls}] ${u.name}</span><span class="lv">Lv.${lv}</span></div>
                <div class="stat">HP: ${st.hp} / ATK: ${st.dmg}${st.heal ? ` / HEAL: ${st.heal}` : ''}<br>CD: ${st.cd}s · ${u.role}</div>
                <button data-u="${u.id}" ${save.credits < cost ? 'disabled' : ''}>
                  <span>強化する</span><span>💎 ${cost}</span>
                </button>
              </div>`;
          }).join('')}
        </div>
        <h3 class="upg-sec-title">■ 指揮官＆アーク施設強化</h3>
        <div class="upg-grid">
          ${BASE_UPGRADES.map(b => {
            const lv = bLv(b.id), cost = baseUpgradeCost(b), maxed = lv >= b.max;
            return `
              <div class="upg-card">
                <div class="top"><span class="nm">${b.name}</span><span class="lv">Lv.${lv}/${b.max}</span></div>
                <div class="stat">${b.desc}</div>
                <button data-b="${b.id}" ${maxed || save.credits < cost ? 'disabled' : ''}>
                  <span>${maxed ? '最大レベル' : '強化する'}</span><span>${maxed ? 'MAX' : '💎 ' + cost}</span>
                </button>
              </div>`;
          }).join('')}
        </div>
      </div>`;

    $('closeUpgBtn').addEventListener('click', () => {
      refreshUnitCardsMeta();
      if (returnTo === 'battle') { S.mode = 'play'; S.paused = true; showOnly('pause'); }
      else if (returnTo === 'result') showResult(); else showMenu();
    });
    $('resetUpgBtn').addEventListener('click', () => {
      let refund = 0;
      for (const u of UNITS) {
        for (let l = 1; l < uLv(u.id); l++) refund += unitCostAt(l);
      }
      for (const b of BASE_UPGRADES) {
        for (let l = 0; l < bLv(b.id); l++) refund += baseCostAt(b, l);
      }
      if (refund > 0) {
        save.credits += refund; save.unitLv = {}; save.baseLv = {};
        writeSave(); sfx('deploy'); renderUpg(); refreshUnitCardsMeta();
      }
    });
    $('upgrade').querySelectorAll('[data-u]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.u, c = unitUpgradeCost(id);
      if (save.credits >= c) { save.credits -= c; save.unitLv[id] = uLv(id) + 1; writeSave(); sfx('deploy'); renderUpg(); }
    }));
    $('upgrade').querySelectorAll('[data-b]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.b, b = BASE_UPGRADES.find(x => x.id === id), c = baseUpgradeCost(b);
      if (save.credits >= c) { save.credits -= c; save.baseLv[id] = bLv(id) + 1; writeSave(); sfx('deploy'); renderUpg(); }
    }));
  };
  renderUpg();
  showOnly('upgrade');
}

function showResult() {
  const win = S.ending.win; S.mode = 'result';
  const m = Math.floor(S.t / 60), s = Math.floor(S.t % 60);
  const next = win && S.si < STAGES.length - 1 && !STAGES[S.si + 1].endless;
  $('result').innerHTML = `
    <div class="tag">${S.stage.name}</div>
    <div class="res-title ${win ? 'win' : 'lose'}">${S.stage.endless ? `WAVE ${S.wave} 到達` : win ? 'STAGE CLEAR' : 'DEFEAT'}</div>
    ${win && !S.stage.endless ? `<div class="keys" style="color:var(--burst);font-size:max(16px,2.8cqw)">${'★'.repeat(S.ending.star)}${'☆'.repeat(3 - S.ending.star)}</div>` : ''}
    <div class="stats">
      <div><span>TIME</span><b>${m}:${String(s).padStart(2, '0')}</b></div>
      <div><span>KILLS</span><b>${S.kills}</b></div>
      <div><span>CORE HITS</span><b>${S.cores}</b></div>
      <div><span>DEPLOYED</span><b>${S.deployed}</b></div>
      <div><span>EARNED 💎</span><b style="color:var(--credit)">+${S.earnedCr}</b></div>
    </div>
    <div class="btns">
      ${next ? `<button class="btn pri" id="nextBtn">次のステージへ</button>` : ''}
      <button class="btn upg" id="resUpgBtn">⚡ 部隊強化ラボ (💎${save.credits})</button>
      <button class="btn ${next ? '' : 'pri'}" id="retryBtn">${win ? 'もう一度' : 'リトライ'}</button>
      <button class="btn" id="menuBtn">ステージ選択</button>
    </div>`;
  if (next) $('nextBtn').addEventListener('click', () => startStage(S.si + 1));
  $('resUpgBtn').addEventListener('click', () => showUpgrade('result'));
  $('retryBtn').addEventListener('click', () => startStage(S.si));
  $('menuBtn').addEventListener('click', showMenu);
  showOnly('result');
}

/* ---------------- Input Handling ---------------- */
function toWorld(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', ev => {
  initAudio();
  if (S.mode !== 'play' || S.paused) return;
  if (ev.button === 2) { reload(); return; }
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  Object.assign(S.aim, toWorld(ev), { on: true }); S.firing = true;
});
cv.addEventListener('pointermove', ev => { Object.assign(S.aim, toWorld(ev)); if (ev.pointerType === 'mouse' || S.firing) S.aim.on = true; });
const stopFire = ev => { S.firing = false; if (ev.pointerType !== 'mouse') S.aim.on = false; };
cv.addEventListener('pointerup', stopFire);
cv.addEventListener('pointercancel', stopFire);
cv.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') { S.aim.on = false; S.firing = false; } });
cv.addEventListener('contextmenu', ev => ev.preventDefault());

window.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('textarea, input:not([type=range])')) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === ' ') ev.preventDefault();
  if (ev.repeat) return;
  const i = UNITS.findIndex(u => u.key === k);
  if (i >= 0) { initAudio(); deploy(i); }
  else if (k === ' ') triggerBurst();
  else if (k === 'r') reload();
  else if (k === 'w') upgradeWallet();
  else if (k === 'q') switchWeapon();
  else if (k === 'e') triggerSkill();
  else if (k === 'a') $('autoBtn').click();
  else if (k === 'p' || k === 'escape') setPause(!S.paused);
});
document.addEventListener('visibilitychange', () => {
  syncBgm();
  if (!document.hidden) return;
  if (S.mode === 'play' && !S.paused) setPause(true); else writeSave();
});
window.addEventListener('pagehide', writeSave);

/* ---------------- Main Loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!S.paused) for (let i = 0; i < S.speed; i++) update(dt);
  render(); syncDock();
  requestAnimationFrame(loop);
}
resize(); showMenu(); requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
</html>
