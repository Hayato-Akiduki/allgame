<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>ALLGAME</title>
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 3DS のホームメニュー風トップページ。
     上画面で選んだゲームのバナーと詳細を表示し、下画面にゲームのアイコンをマス目状に配置する。
     サイトを組み立てるとき dashboard.js（記録・スタンプ）と backup.js（セーブ）が読み込まれる。 */
  :root {
    --bg: #0c0f16;
    --top-bg: #10141e;
    --bot-bg: #141925;
    --panel: #19202e;
    --panel-2: #222b3d;
    --line: #2d374c;
    --slot-bg: rgba(9, 12, 18, .48);
    --slot-line: rgba(255, 255, 255, .09);
    --text: #f1f4fa;
    --muted: #93a0b8;
    --accent: #4f8cff;      /* 選んでいるゲームの色に変わる */
    --cursor: #5ce1e6;      /* 3DS 風の選択カーソル色 */
    --rows: 2;
    --tile: 132px;
    --gap: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; color: inherit; }

  /* 上下 2 画面構成 */
  .screen {
    position: relative; z-index: 1; height: 100%;
    display: grid;
    grid-template-rows: minmax(216px, 38vh) 6px minmax(0, 1fr);
    grid-template-columns: minmax(0, 1fr);
  }

  /* ==================== 上画面（ステータス + 3D バナープレビュー） ==================== */
  .top-screen {
    position: relative;
    display: grid;
    grid-template-rows: 46px minmax(0, 1fr);
    overflow: hidden;
    background:
      radial-gradient(ellipse 68% 95% at 28% 58%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 72%),
      radial-gradient(ellipse 46% 75% at 84% 26%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 74%),
      linear-gradient(180deg, #121723 0%, #0b0e15 100%);
    transition: background .35s ease;
  }
  .top-screen::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .15));
  }

  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 10px; padding: 0 28px;
    background: linear-gradient(180deg, rgba(8, 10, 16, .68), rgba(8, 10, 16, .22));
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-weight: 800; letter-spacing: .12em; font-size: 15px;
  }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .11); font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  button.chip { cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
  button.chip:hover, button.chip:focus-visible { background: rgba(255, 255, 255, .15); border-color: rgba(255, 255, 255, .28); outline: none; }

  /* 音量コントロール（スライダー + ミュート） */
  .vol-box {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .11);
    font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .vol-btn {
    width: 24px; height: 22px; padding: 0; border: none; border-radius: 999px;
    background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 14px;
    transition: background-color .15s ease;
  }
  .vol-btn:hover, .vol-btn:focus-visible { background: rgba(255, 255, 255, .14); outline: none; }
  .vol-range {
    width: 72px; height: 4px; margin: 0; cursor: pointer;
    accent-color: var(--cursor);
  }
  .vol-pct { min-width: 32px; text-align: right; color: var(--muted); font-size: 11px; font-weight: 600; }

  .clock {
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    min-width: 54px; text-align: right; letter-spacing: .04em;
  }

  /* 上画面メインバナー */
  .stage {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 36px;
    padding: 14px 40px 18px;
    min-height: 0;
  }
  .hero-wrap {
    position: relative; flex: none;
    display: grid; place-items: center;
    perspective: 700px;
  }
  .hero-shadow {
    position: absolute; bottom: -14px; width: 108px; height: 18px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .62), transparent);
    animation: hero-shadow 3.4s ease-in-out infinite;
  }
  .hero-card {
    position: relative;
    width: 126px; height: 126px; border-radius: 26px;
    display: grid; place-items: center;
    background:
      linear-gradient(155deg, color-mix(in srgb, var(--accent) 88%, #ffffff 12%), color-mix(in srgb, var(--accent) 55%, #0c1019 45%));
    border: 2px solid color-mix(in srgb, var(--accent) 45%, #ffffff 55%);
    box-shadow:
      0 18px 36px rgba(0, 0, 0, .48),
      0 0 32px color-mix(in srgb, var(--accent) 32%, transparent),
      inset 0 2px 1px rgba(255, 255, 255, .45),
      inset 0 -8px 16px rgba(0, 0, 0, .28);
    animation: hero-float 3.4s ease-in-out infinite;
  }
  .hero-card::before {
    content: "";
    position: absolute; inset: 4px 6px auto 6px; height: 42%; border-radius: 20px 20px 44% 44%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, .04));
    pointer-events: none;
  }
  .hero-card.pop { animation: hero-pop .26s cubic-bezier(.22, 1.15, .36, 1) both, hero-float 3.4s ease-in-out .26s infinite; }
  .hero-card.empty {
    background: rgba(255, 255, 255, .04);
    border: 2px dashed rgba(255, 255, 255, .2);
    box-shadow: none;
    animation: none;
  }
  .hero-card.empty::before { display: none; }
  .hero-icon {
    position: relative; z-index: 1;
    font-size: 62px; line-height: 1;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35));
  }
  .hero-card.empty .hero-icon { font-size: 34px; opacity: .45; filter: none; }

  @keyframes hero-float {
    0%, 100% { transform: translateY(0) rotateY(-5deg) rotateX(3deg); }
    50% { transform: translateY(-7px) rotateY(5deg) rotateX(-2deg); }
  }
  @keyframes hero-shadow {
    0%, 100% { transform: scale(1); opacity: .72; }
    50% { transform: scale(.84); opacity: .44; }
  }
  @keyframes hero-pop {
    0% { transform: scale(.82) translateY(8px); opacity: .25; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .hero-info {
    flex: 1; max-width: 640px; min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .hero-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 22%, rgba(255, 255, 255, .06));
    border: 1px solid color-mix(in srgb, var(--accent) 52%, transparent);
    color: var(--text);
  }
  .tag.subtle {
    background: rgba(255, 255, 255, .07);
    border-color: rgba(255, 255, 255, .12);
    color: var(--muted);
    font-weight: 600;
  }
  .hero-title {
    font-size: clamp(24px, 3vw, 36px); font-weight: 800; line-height: 1.18;
    letter-spacing: .01em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .45);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hero-meta { color: var(--muted); font-size: 13px; }
  .hero-prog { font-size: 14px; color: #dbe6fb; min-height: 1.4em; }

  /* ヒンジ風区切り */
  .hinge {
    background: linear-gradient(180deg, #06080c 0%, #242d3f 50%, #090c12 100%);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .08);
  }

  /* ==================== 下画面（ツールバー + マス目グリッド + アクションバー） ==================== */
  .bottom-screen {
    position: relative;
    display: grid;
    grid-template-rows: 50px minmax(0, 1fr) 56px;
    min-height: 0;
    background-color: var(--bot-bg);
    background-image:
      radial-gradient(rgba(255, 255, 255, .065) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  /* 下画面トップツールバー（3DS の小アイコンバー風） */
  .dock {
    display: flex; align-items: center; gap: 12px; padding: 6px 24px;
    background: linear-gradient(180deg, rgba(12, 16, 24, .78), rgba(16, 21, 32, .45));
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }
  .sysrow { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .dock-btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
    border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #252e42, #1b2232);
    border: 1px solid #35415a;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .12);
    font-size: 13px; font-weight: 600; color: #dbe3f3; white-space: nowrap;
    transition: transform .1s ease, border-color .12s ease, background-color .12s ease;
  }
  .dock-btn .d-ico { font-size: 15px; line-height: 1; }
  .dock-btn:hover { background: linear-gradient(180deg, #2d3850, #20293c); border-color: #4f6185; }
  .dock-btn:active { transform: translateY(1px); }
  .dock-btn.sel, .dock-btn:focus-visible {
    outline: 2px solid var(--cursor); outline-offset: 2px;
    border-color: var(--cursor); color: #fff;
  }
  .dock-btn:disabled { opacity: .38; cursor: default; transform: none; }
  .dock-btn .dot {
    position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: #ff4d6d; color: #fff;
    font-size: 11px; font-weight: 800; display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
  }
  .dock .spacer { flex: 1; }
  .dock-status {
    font-size: 12px; color: var(--muted); white-space: nowrap;
    padding: 0 4px;
  }
  .zoom-group {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px; border-radius: 11px;
    background: rgba(0, 0, 0, .28); border: 1px solid rgba(255, 255, 255, .08);
  }
  .zoom-group .dock-btn { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; box-shadow: none; }
  .zoom-label {
    font-size: 11px; color: var(--muted); min-width: 34px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ゲームアイコンのグリッド領域 */
  .grid-area {
    position: relative;
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 38px;
    align-items: center;
    min-height: 0;
    padding: 0 8px;
  }
  .page-arrow {
    width: 34px; height: 84px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .1);
    color: var(--text); font-size: 16px; font-weight: 800;
    transition: background-color .14s ease, opacity .14s ease, transform .1s ease;
  }
  .page-arrow:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
  .page-arrow:active:not(:disabled) { transform: scale(.96); }
  .page-arrow:disabled { opacity: .2; cursor: default; }

  .shelf-scroll {
    height: 100%; width: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-behavior: smooth;
    display: flex; align-items: center;
    padding: 12px 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, .22) transparent;
  }
  .shelf-scroll::-webkit-scrollbar { height: 8px; }
  .shelf-scroll::-webkit-scrollbar-track { background: transparent; }
  .shelf-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .2); border-radius: 999px; }
  .shelf-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .34); }

  .shelf {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(var(--rows), var(--tile));
    grid-auto-columns: var(--tile);
    gap: var(--gap);
    margin: 0 auto;
    padding: 6px;
  }

  /* 3DS の 1 マス（ゲームスロット / 空きスロット） */
  .slot {
    position: relative;
    width: var(--tile); height: var(--tile);
    padding: 0; border: none; background: transparent;
    cursor: pointer; border-radius: 18px;
    display: grid; place-items: center;
    transition: transform .14s cubic-bezier(.22, 1, .36, 1);
  }
  .slot:focus { outline: none; }

  /* 空きスロットの凹み枠 */
  .slot.empty {
    background: var(--slot-bg);
    border: 1.5px solid var(--slot-line);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .42);
  }
  .slot.empty::after {
    content: "";
    width: 26%; height: 26%; border-radius: 6px;
    border: 1.5px dashed rgba(255, 255, 255, .1);
  }

  /* ゲーム入りスロットのソフトアイコン本体 */
  .tile-face {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 18px;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 10px 8px 7px;
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #ffffff 18%) 0%, color-mix(in srgb, var(--c) 50%, #101521 50%) 100%);
    border: 2px solid color-mix(in srgb, var(--c) 38%, rgba(255, 255, 255, .62));
    box-shadow:
      0 6px 14px rgba(0, 0, 0, .38),
      inset 0 2px 1px rgba(255, 255, 255, .42),
      inset 0 -6px 12px rgba(0, 0, 0, .28);
    transition: box-shadow .15s ease, filter .15s ease;
  }
  .tile-face::before {
    content: "";
    position: absolute; inset: 2px 4px auto 4px; height: 42%;
    border-radius: 14px 14px 48% 48%;
    background: linear-gradient(180deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, .02));
    pointer-events: none;
  }
  .tile-ico {
    position: relative; z-index: 1;
    flex: 1; display: grid; place-items: center;
    font-size: calc(var(--tile) * .38); line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .32));
  }
  .tile-name {
    position: relative; z-index: 1;
    width: 100%;
    padding: 3px 5px; border-radius: 8px;
    background: rgba(8, 11, 18, .68);
    color: #f6f8fc;
    font-size: 12px; font-weight: 700; line-height: 1.25;
    text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
  }
  .tile-badge {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 999px;
    background: #10141f; color: #fff;
    border: 1px solid rgba(255, 255, 255, .28);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    letter-spacing: .03em;
  }
  .tile-badge.new-game { background: #ff4d6d; border-color: rgba(255, 255, 255, .45); }
  .tile-badge.ext { background: rgba(10, 14, 24, .82); color: #bfe0ff; }

  /* 3DS 風の 4 隅選択カーソル */
  .cursor-frame {
    position: absolute; inset: -6px; pointer-events: none; z-index: 3;
    opacity: 0; transform: scale(.94);
    transition: opacity .12s ease, transform .14s ease;
  }
  .cursor-frame i {
    position: absolute; width: 18px; height: 18px;
    border: 3.5px solid var(--cursor);
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--cursor) 70%, transparent));
  }
  .cursor-frame i:nth-child(1) { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
  .cursor-frame i:nth-child(2) { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
  .cursor-frame i:nth-child(3) { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
  .cursor-frame i:nth-child(4) { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 10px 0; }

  .slot.sel { transform: translateY(-3px) scale(1.03); z-index: 2; }
  .slot.sel .tile-face {
    box-shadow:
      0 12px 24px rgba(0, 0, 0, .52),
      0 0 18px color-mix(in srgb, var(--c) 45%, transparent),
      inset 0 2px 1px rgba(255, 255, 255, .52);
  }
  .slot.sel .cursor-frame {
    opacity: 1;
    animation: cursor-pulse 1.15s ease-in-out infinite;
  }
  @keyframes cursor-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  /* ドラッグ＆ドロップ（アイコン移動） */
  .slot.dragging { opacity: .4; transform: scale(.94); }
  .slot.drop-target {
    background: color-mix(in srgb, var(--cursor) 18%, transparent);
    border-color: var(--cursor);
    transform: scale(1.04);
  }
  .slot.drop-target .tile-face { filter: brightness(1.18); }

  /* 行数ごとのタイルサイズ調整 */
  .screen[data-rows="1"] { --rows: 1; --tile: 174px; --gap: 18px; }
  .screen[data-rows="2"] { --rows: 2; --tile: 132px; --gap: 14px; }
  .screen[data-rows="3"] { --rows: 3; --tile: 96px; --gap: 10px; }
  .screen[data-rows="3"] .tile-face { border-radius: 14px; padding: 6px 5px 5px; }
  .screen[data-rows="3"] .slot { border-radius: 14px; }
  .screen[data-rows="3"] .tile-name { font-size: 10px; padding: 2px 3px; -webkit-line-clamp: 1; border-radius: 6px; }
  .screen[data-rows="3"] .tile-badge { font-size: 9px; padding: 1px 5px; top: 4px; right: 4px; }
  .screen[data-rows="3"] .cursor-frame { inset: -4px; }
  .screen[data-rows="3"] .cursor-frame i { width: 14px; height: 14px; border-width: 3px; }
  .screen[data-rows="1"] .tile-face { border-radius: 22px; padding: 14px 10px 10px; }
  .screen[data-rows="1"] .tile-name { font-size: 14px; padding: 5px 8px; }

  /* 下画面ボトムバー（3DS の「はじめる」バー + 操作ヒント） */
  .actionbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 16px; padding: 0 24px;
    background: linear-gradient(180deg, rgba(14, 18, 28, .86), rgba(8, 10, 16, .96));
    border-top: 1px solid rgba(255, 255, 255, .09);
  }
  .hints {
    display: flex; align-items: center; gap: 14px;
    color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden;
  }
  .hints .h { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .key {
    display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16);
    color: var(--text); font-size: 11px; font-weight: 700;
  }
  .key.pad { border-radius: 999px; min-width: 22px; padding: 0; }

  .play-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-width: 220px; max-width: 380px; height: 40px; padding: 0 26px;
    border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--accent) 45%, #ffffff 55%);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 90%, #fff 10%), color-mix(in srgb, var(--accent) 78%, #000 22%));
    color: #081018; font-weight: 800; font-size: 15px; letter-spacing: .04em;
    cursor: pointer;
    box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 36%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .12s ease, filter .15s ease, opacity .15s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .play-cta:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .play-cta:active:not(:disabled) { transform: translateY(1px); }
  .play-cta:disabled {
    background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .12);
    color: var(--muted); box-shadow: none; cursor: default;
  }

  .ver-info {
    text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap;
  }

  /* パネル（スタンプ・記録・セーブ・操作方法） */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
    background: rgba(5, 7, 12, .74); backdrop-filter: blur(4px);
  }
  .overlay.open { display: grid; }
  .sheet {
    width: min(980px, calc(100vw - 48px)); max-height: calc(100vh - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px 28px 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .sheet .close { float: right; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 14px;
  }
  .btn:hover, .btn.sel, .btn:focus-visible { border-color: var(--cursor); outline: none; background: #29344a; }
  .btn.primary { background: var(--accent); color: #0a0c11; border-color: transparent; font-weight: 800; }
  .btn.primary.sel, .btn.primary:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 150px; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rec th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.rec td { padding: 9px 8px; border-bottom: 1px solid rgba(255, 255, 255, .05); vertical-align: top; }
  table.rec td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.rec .g { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  table.rec .p { color: var(--muted); font-size: 12px; margin-top: 2px; font-weight: 400; }

  .stamps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .stamp { position: relative; display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .stamp .seal {
    flex: none; width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; font-size: 11px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .stamp.got .seal { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .stamp .s-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .stamp .s-goal { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .stamp:not(.got) .s-title { color: var(--muted); }
  .stamp.new { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .stamp.new::after {
    content: 'NEW'; position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 800;
    background: var(--c); color: #0a0c11; border-radius: 4px; padding: 1px 4px;
  }
  .complete {
    grid-column: 1 / -1; text-align: center; padding: 12px; border-radius: 10px; font-weight: 800;
    border: 1px solid var(--line); color: var(--text);
  }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; align-items: center; font-size: 14px; }
  .keys .k { display: flex; gap: 6px; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 16px; }

  /* 通知（スタンプ獲得など） */
  .toasts { position: fixed; bottom: 68px; right: 28px; z-index: 20; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    background: var(--panel-2); border: 1px solid var(--line);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
    animation: toast 4.2s ease both;
  }
  .toast .ti { font-size: 22px; }
  @keyframes toast { 0% { transform: translateX(30px); opacity: 0; } 8%, 88% { transform: none; opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }

  /* ゲームを開くときの暗転 */
  .fade { position: fixed; inset: 0; z-index: 30; background: #000; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .fade.on { opacity: 1; }

  /* ウィンドウ高さが低いとき（最小 800x600 など）でも画面内に収める */
  @media (max-height: 700px) {
    .screen { grid-template-rows: minmax(176px, 34vh) 5px minmax(0, 1fr); }
    .hero-card { width: 96px; height: 96px; border-radius: 20px; }
    .hero-icon { font-size: 46px; }
    .hero-title { font-size: 24px; }
    .stage { gap: 24px; padding: 10px 28px; }
    .screen[data-rows="1"] { --tile: 148px; --gap: 14px; }
    .screen[data-rows="2"] { --tile: 112px; --gap: 10px; }
    .screen[data-rows="3"] { --tile: 80px; --gap: 8px; }
    .screen[data-rows="2"] .tile-name { font-size: 11px; }
  }
  @media (max-width: 820px) {
    .topbar, .dock, .actionbar { padding-left: 14px; padding-right: 14px; }
    .stage { padding: 10px 18px; gap: 18px; }
    .chip.opt, .dock-status, .hints, .vol-pct { display: none; }
    .vol-range { width: 54px; }
    .actionbar { grid-template-columns: 1fr auto 1fr; }
    .dock-btn .d-lbl { display: none; }
    .dock-btn { padding: 0 10px; }
    .zoom-group .dock-btn { padding: 0 9px; }
  }

  /* ==================== ホワイトモード（3DS ベーシックホワイト風） ==================== */
  html[data-theme="light"] {
    --bg: #eef2f7;
    --top-bg: #f6f8fc;
    --bot-bg: #f1f4f9;
    --panel: #ffffff;
    --panel-2: #edf2f8;
    --line: #cfd8e6;
    --slot-bg: rgba(255, 255, 255, .72);
    --slot-line: rgba(30, 48, 84, .14);
    --text: #182233;
    --muted: #5b6a82;
    --cursor: #00a8c6;
  }
  html[data-theme="light"] .top-screen {
    background:
      radial-gradient(ellipse 68% 95% at 28% 58%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 72%),
      radial-gradient(ellipse 46% 75% at 84% 26%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 74%),
      linear-gradient(180deg, #fafcff 0%, #e7eef7 100%);
  }
  html[data-theme="light"] .top-screen::before {
    background-image:
      linear-gradient(rgba(20, 38, 70, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20, 38, 70, .05) 1px, transparent 1px);
  }
  html[data-theme="light"] .topbar {
    background: linear-gradient(180deg, rgba(255, 255, 255, .86), rgba(244, 248, 253, .62));
    border-bottom-color: rgba(20, 38, 70, .1);
  }
  html[data-theme="light"] .chip,
  html[data-theme="light"] .vol-box {
    background: rgba(255, 255, 255, .78);
    border-color: rgba(20, 38, 70, .14);
    color: var(--text);
  }
  html[data-theme="light"] button.chip:hover,
  html[data-theme="light"] button.chip:focus-visible,
  html[data-theme="light"] .vol-btn:hover,
  html[data-theme="light"] .vol-btn:focus-visible {
    background: rgba(20, 38, 70, .08);
    border-color: rgba(20, 38, 70, .24);
  }
  html[data-theme="light"] .hero-title { text-shadow: 0 1px 0 rgba(255, 255, 255, .8); }
  html[data-theme="light"] .hero-prog { color: #2b3b55; }
  html[data-theme="light"] .hero-shadow {
    background: radial-gradient(closest-side, rgba(20, 38, 70, .26), transparent);
  }
  html[data-theme="light"] .hero-card.empty {
    background: rgba(255, 255, 255, .65);
    border-color: rgba(20, 38, 70, .22);
  }
  html[data-theme="light"] .tag {
    background: color-mix(in srgb, var(--accent) 18%, #ffffff 82%);
    border-color: color-mix(in srgb, var(--accent) 48%, transparent);
    color: #162030;
  }
  html[data-theme="light"] .tag.subtle {
    background: rgba(20, 38, 70, .06);
    border-color: rgba(20, 38, 70, .14);
    color: var(--muted);
  }
  html[data-theme="light"] .hinge {
    background: linear-gradient(180deg, #c6d0df 0%, #f5f8fc 50%, #bcc7d8 100%);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .7);
  }
  html[data-theme="light"] .bottom-screen {
    background-image: radial-gradient(rgba(26, 46, 82, .11) 1px, transparent 1px);
  }
  html[data-theme="light"] .dock {
    background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(239, 244, 251, .76));
    border-bottom-color: rgba(20, 38, 70, .1);
  }
  html[data-theme="light"] .dock-btn {
    background: linear-gradient(180deg, #ffffff, #e8eef6);
    border-color: #c3cfdf;
    box-shadow: 0 2px 0 rgba(20, 38, 70, .1), inset 0 1px 0 #ffffff;
    color: #1c2940;
  }
  html[data-theme="light"] .dock-btn:hover {
    background: linear-gradient(180deg, #ffffff, #dde6f2);
    border-color: #9ab0cc;
  }
  html[data-theme="light"] .dock-btn.sel,
  html[data-theme="light"] .dock-btn:focus-visible { color: #0f1726; }
  html[data-theme="light"] .zoom-group {
    background: rgba(20, 38, 70, .06);
    border-color: rgba(20, 38, 70, .12);
  }
  html[data-theme="light"] .page-arrow {
    background: rgba(255, 255, 255, .82);
    border-color: rgba(20, 38, 70, .14);
    color: #26354d;
    box-shadow: 0 2px 6px rgba(20, 38, 70, .08);
  }
  html[data-theme="light"] .page-arrow:hover:not(:disabled) { background: #ffffff; }
  html[data-theme="light"] .shelf-scroll { scrollbar-color: rgba(20, 38, 70, .24) transparent; }
  html[data-theme="light"] .shelf-scroll::-webkit-scrollbar-thumb { background: rgba(20, 38, 70, .2); }
  html[data-theme="light"] .shelf-scroll::-webkit-scrollbar-thumb:hover { background: rgba(20, 38, 70, .34); }
  html[data-theme="light"] .slot.empty {
    box-shadow: inset 0 2px 5px rgba(20, 38, 70, .12);
  }
  html[data-theme="light"] .slot.empty::after { border-color: rgba(20, 38, 70, .16); }
  html[data-theme="light"] .tile-face {
    box-shadow:
      0 6px 14px rgba(20, 38, 70, .16),
      inset 0 2px 1px rgba(255, 255, 255, .55),
      inset 0 -6px 12px rgba(0, 0, 0, .18);
  }
  html[data-theme="light"] .slot.sel .tile-face {
    box-shadow:
      0 12px 24px rgba(20, 38, 70, .24),
      0 0 18px color-mix(in srgb, var(--c) 38%, transparent),
      inset 0 2px 1px rgba(255, 255, 255, .62);
  }
  html[data-theme="light"] .actionbar {
    background: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(235, 241, 249, .96));
    border-top-color: rgba(20, 38, 70, .12);
  }
  html[data-theme="light"] .key {
    background: #ffffff; border-color: #c5d0e0; color: #1c2940;
    box-shadow: 0 1px 0 rgba(20, 38, 70, .1);
  }
  html[data-theme="light"] .play-cta:disabled {
    background: rgba(20, 38, 70, .08); border-color: rgba(20, 38, 70, .14); color: var(--muted);
  }
  html[data-theme="light"] .overlay { background: rgba(15, 23, 42, .42); }
  html[data-theme="light"] .sheet { box-shadow: 0 24px 60px rgba(15, 23, 42, .22); }
  html[data-theme="light"] .btn:hover,
  html[data-theme="light"] .btn.sel,
  html[data-theme="light"] .btn:focus-visible { background: #dfe8f4; }
  html[data-theme="light"] table.rec td { border-bottom-color: rgba(20, 38, 70, .08); }
  html[data-theme="light"] .toast { box-shadow: 0 10px 28px rgba(15, 23, 42, .16); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .shelf-scroll { scroll-behavior: auto; }
  }
</style>

<body>
<div class="screen" id="screen" data-rows="2">
  <section class="top-screen" aria-label="選んだゲーム">
    <header class="topbar">
      <div class="brand"><img src="icon.png" alt=""><span>ALLGAME</span></div>
      <div class="spacer"></div>
      <div id="chips" style="display:flex;gap:8px"></div>
      <button class="chip" id="theme" type="button" title="ダーク / ホワイト切り替え（T）"></button>
      <div class="vol-box" title="効果音の音量調整（[ / ]、ミュートは M）">
        <button class="vol-btn" id="sound" type="button" aria-label="効果音ミュート切り替え"></button>
        <input class="vol-range" id="volume" type="range" min="0" max="100" step="5" aria-label="効果音の音量">
        <span class="vol-pct" id="vol-pct"></span>
      </div>
      <div class="clock" id="clock"></div>
    </header>
    <div class="stage" id="stage" aria-live="polite"></div>
  </section>

  <div class="hinge" aria-hidden="true"></div>

  <main class="bottom-screen">
    <div class="dock">
      <nav class="sysrow" id="sysrow" aria-label="メニュー"></nav>
      <div class="spacer"></div>
      <span class="dock-status" id="layout-status"></span>
      <button class="dock-btn" id="sort-reset" type="button" title="最近遊んだ順に並べ直す">
        <span class="d-ico">↺</span><span class="d-lbl">最近順</span>
      </button>
      <div class="zoom-group" role="group" aria-label="アイコンの大きさ">
        <button class="dock-btn" id="zoom-out" type="button" title="アイコンを小さくする（−）">−</button>
        <span class="zoom-label" id="zoom-label">2段</span>
        <button class="dock-btn" id="zoom-in" type="button" title="アイコンを大きくする（＋）">＋</button>
      </div>
    </div>

    <div class="grid-area">
      <button class="page-arrow" id="page-prev" type="button" aria-label="左へスクロール">◀</button>
      <div class="shelf-scroll" id="shelf-scroll">
        <div class="shelf" id="shelf" role="grid" aria-label="ゲーム一覧"></div>
      </div>
      <button class="page-arrow" id="page-next" type="button" aria-label="右へスクロール">▶</button>
    </div>

    <footer class="actionbar">
      <div class="hints" id="hints"></div>
      <button class="play-cta" id="play-cta" type="button">はじめる</button>
      <div class="ver-info" id="ver-info"></div>
    </footer>
  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div class="fade" id="fade"></div>

<script>
(() => {
  const UI_KEY = 'allgame-ui'; // 最後に選んでいたゲーム・効果音・行数・カスタム配置（このブラウザだけの設定）
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ui = (() => { try { return JSON.parse(localStorage.getItem(UI_KEY) || '{}'); } catch { return {}; } })();
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} };
  if (ui.sound === undefined) ui.sound = true;
  if (typeof ui.volume !== 'number' || Number.isNaN(ui.volume)) ui.volume = 70;
  ui.volume = Math.max(0, Math.min(100, Math.round(ui.volume)));
  if (ui.theme !== 'dark' && ui.theme !== 'light') ui.theme = 'dark';
  let rows = [1, 2, 3].includes(ui.rows) ? ui.rows : 2;

  // ---- テーマ（ダーク / ホワイト）----
  function applyTheme() {
    document.documentElement.dataset.theme = ui.theme;
    const isLight = ui.theme === 'light';
    $('theme').textContent = isLight ? '☀️ ホワイト' : '🌙 ダーク';
    $('theme').setAttribute('aria-label', isLight ? 'ホワイトモード（クリックでダークへ）' : 'ダークモード（クリックでホワイトへ）');
  }
  function toggleTheme() {
    ui.theme = ui.theme === 'light' ? 'dark' : 'light';
    saveUi();
    applyTheme();
    beep('ok');
  }
  $('theme').addEventListener('click', toggleTheme);
  applyTheme();

  // ---- 効果音・音量（その場で合成する短い音）----
  let ac = null;
  const effectiveVolume = () => (ui.sound ? ui.volume : 0);
  function beep(kind) {
    const vol = effectiveVolume();
    if (vol <= 0) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const gain = Math.pow(vol / 100, 1.35) * 0.11;
      const notes = {
        move: [[780, 0, .032]],
        ok: [[660, 0, .05], [990, .05, .08]],
        back: [[520, 0, .05], [390, .05, .07]],
        open: [[587, 0, .04], [880, .04, .06]],
        zoom: [[620, 0, .03], [840, .03, .045]],
      }[kind];
      for (const [f, at, len] of notes) {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + len);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + .02);
      }
    } catch { /* 音が出せない環境では何もしない */ }
  }
  function renderSound() {
    const vol = effectiveVolume();
    const icon = vol === 0 ? '🔇' : vol < 35 ? '🔈' : vol < 70 ? '🔉' : '🔊';
    $('sound').textContent = icon;
    $('sound').setAttribute('aria-label', vol > 0 ? `効果音オン（${vol}%）` : '効果音ミュート');
    $('volume').value = String(vol);
    $('vol-pct').textContent = vol > 0 ? `${vol}%` : '切';
  }
  function setVolume(next, playSample) {
    const v = Math.max(0, Math.min(100, Math.round(next)));
    ui.volume = v;
    ui.sound = v > 0;
    saveUi();
    renderSound();
    if (playSample && v > 0) beep('move');
  }
  $('sound').addEventListener('click', () => {
    if (effectiveVolume() === 0) {
      ui.sound = true;
      if (ui.volume === 0) ui.volume = 70;
    } else {
      ui.sound = false;
    }
    saveUi();
    renderSound();
    beep('ok');
  });
  $('volume').addEventListener('input', (e) => { setVolume(Number(e.target.value), false); });
  $('volume').addEventListener('change', (e) => { setVolume(Number(e.target.value), true); });
  renderSound();

  // ---- 時計 ----
  const tick = () => { const d = new Date(); $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
  tick(); setInterval(tick, 10000);

  // ---- 状態 ----
  let games = [], gameMap = new Map(), slots = [], data = null, version = '';
  let zone = 'grid', slotIdx = 0, sysIdx = 0, panel = null, padConnected = false;
  let lastHeroKey = '', dragFrom = null;
  const sysItems = [];

  // マウスを実際に動かしたときだけホバー選択する（スクロールやキーボード移動中にカーソルが選択を奪わないように）
  let lastXY = null, movedNow = false;
  document.addEventListener('mousemove', (e) => {
    movedNow = !!(lastXY && (lastXY[0] !== e.clientX || lastXY[1] !== e.clientY));
    lastXY = [e.clientX, e.clientY];
  }, { capture: true, passive: true });
  const realMove = () => movedNow;

  // 最近遊んだ順の配列を返す
  function recentOrder() {
    const list = [...games];
    if (data) {
      const last = (g) => (data.perGame[g.id] && data.perGame[g.id].last) || 0;
      list.sort((a, b) => last(b) - last(a) || games.indexOf(a) - games.indexOf(b));
    }
    return list;
  }

  // スロット一覧（3DS 風の空きマス込み配列）を組み立てる
  function buildSlots() {
    const minCols = rows === 1 ? Math.max(games.length + 2, 12) : rows === 2 ? 8 : 7;
    let raw;
    if (Array.isArray(ui.slots) && ui.slots.length) {
      const seen = new Set();
      raw = ui.slots.map((id) => {
        if (typeof id === 'string' && gameMap.has(id) && !seen.has(id)) { seen.add(id); return id; }
        return null;
      });
      // 追加された新しいゲームは最初の空きマスへ入れる
      for (const g of games) {
        if (!seen.has(g.id)) {
          const emptyAt = raw.indexOf(null);
          if (emptyAt >= 0) raw[emptyAt] = g.id;
          else raw.push(g.id);
          seen.add(g.id);
        }
      }
    } else {
      raw = recentOrder().map((g) => g.id);
    }
    let lastFilled = -1;
    for (let i = raw.length - 1; i >= 0; i--) { if (raw[i]) { lastFilled = i; break; } }
    const neededCols = Math.max(minCols, Math.ceil((lastFilled + 1) / rows) + 1);
    const total = neededCols * rows;
    slots = Array.from({ length: total }, (_, i) => (i < raw.length ? raw[i] : null));
  }

  function saveCustomSlots() {
    let lastFilled = -1;
    for (let i = slots.length - 1; i >= 0; i--) { if (slots[i]) { lastFilled = i; break; } }
    ui.slots = slots.slice(0, lastFilled + 1);
    saveUi();
  }

  function currentGame() {
    const id = slots[slotIdx];
    return id ? gameMap.get(id) || null : null;
  }

  function firstGameSlot() {
    const i = slots.findIndex(Boolean);
    return i >= 0 ? i : 0;
  }

  function lastGameSlot() {
    for (let i = slots.length - 1; i >= 0; i--) { if (slots[i]) return i; }
    return 0;
  }

  fetch('__games.json').then((r) => r.json()).then((d) => {
    games = d.games || [];
    gameMap = new Map(games.map((g) => [g.id, g]));
    version = d.version || '';
    data = window.ALLGAME_DATA ? window.ALLGAME_DATA.load(games) : null;
    buildSlots();
    const remembered = ui.focus ? slots.indexOf(ui.focus) : -1;
    slotIdx = remembered >= 0 ? remembered : firstGameSlot();
    initChrome();
    renderGrid();
    select(slotIdx, true, true);
  });

  function initChrome() {
    // 上のバーの情報
    const chips = $('chips');
    if (data) {
      const got = data.stamps.filter((s) => s.got).length;
      const c1 = el('button', 'chip opt', `🏅 スタンプ ${got} / ${data.stamps.length}`); c1.type = 'button'; c1.title = 'スタンプカード';
      c1.addEventListener('click', () => openPanel('stamps'));
      const c2 = el('button', 'chip opt', `⏱ ${data.totalMs ? window.ALLGAME_DATA.duration(data.totalMs) : '0分'}`); c2.type = 'button'; c2.title = '記録';
      c2.addEventListener('click', () => openPanel('records'));
      chips.append(c1, c2);
      if (got === data.stamps.length) document.body.classList.add('allgame-complete');
    }

    // 下画面ツールバーのシステムメニュー
    const addSys = (icon, label, fn, dot) => {
      const b = el('button', 'dock-btn'); b.type = 'button'; b.title = label;
      if (dot) b.appendChild(el('span', 'dot', String(dot)));
      b.append(el('span', 'd-ico', icon), el('span', 'd-lbl', label));
      const i = sysItems.length;
      b.addEventListener('mousemove', () => { if (realMove() && (zone !== 'sys' || sysIdx !== i)) { zone = 'sys'; sysIdx = i; paint(); } });
      b.addEventListener('click', () => { zone = 'sys'; sysIdx = i; paint(); fn(); });
      sysItems.push(b);
      $('sysrow').appendChild(b);
    };
    if (data) {
      const fresh = data.stamps.filter((s) => s.isNew).length;
      addSys('🏅', 'スタンプ', () => openPanel('stamps'), fresh);
      addSys('📊', '記録', () => openPanel('records'));
    }
    if (window.ALLGAME_BACKUP) addSys('💾', 'セーブ', () => openPanel('save'));
    addSys('🎮', '操作方法', () => openPanel('help'));

    // ツールバー右側のボタン（並び順リセット・サイズ変更）もキーボード移動対象に含める
    const bindExtraDock = (btn, fn) => {
      const i = sysItems.length;
      btn.addEventListener('mousemove', () => { if (realMove() && (zone !== 'sys' || sysIdx !== i)) { zone = 'sys'; sysIdx = i; paint(); } });
      btn.addEventListener('click', () => { fn(); });
      sysItems.push(btn);
    };
    bindExtraDock($('sort-reset'), resetOrder);
    bindExtraDock($('zoom-out'), () => setRows(rows + 1));
    bindExtraDock($('zoom-in'), () => setRows(rows - 1));

    // ページ送り矢印とホイール横スクロール
    const scroller = $('shelf-scroll');
    const stepScroll = (dir) => {
      const w = Math.max(220, scroller.clientWidth * 0.7);
      scroller.scrollBy({ left: dir * w, behavior: 'smooth' });
      beep('move');
    };
    $('page-prev').addEventListener('click', () => stepScroll(-1));
    $('page-next').addEventListener('click', () => stepScroll(1));
    scroller.addEventListener('scroll', updatePageArrows, { passive: true });
    window.addEventListener('resize', updatePageArrows, { passive: true });
    scroller.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        scroller.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // 下画面中央の「はじめる」ボタン
    $('play-cta').addEventListener('click', launch);

    // 新しく取ったスタンプを通知
    if (data) data.stamps.filter((s) => s.isNew).slice(0, 4).forEach((s, i) => setTimeout(() => toast(s.icon, `スタンプ獲得！ ${s.title}`, s.goal), 500 + i * 650));
  }

  function updatePageArrows() {
    const s = $('shelf-scroll');
    const max = s.scrollWidth - s.clientWidth;
    $('page-prev').disabled = s.scrollLeft <= 2;
    $('page-next').disabled = max <= 2 || s.scrollLeft >= max - 2;
  }

  function setRows(nextRows) {
    const clamped = Math.max(1, Math.min(3, nextRows));
    if (clamped === rows) return;
    const focusedId = slots[slotIdx];
    rows = clamped;
    ui.rows = rows;
    saveUi();
    beep('zoom');
    buildSlots();
    if (focusedId) {
      const nextIdx = slots.indexOf(focusedId);
      slotIdx = nextIdx >= 0 ? nextIdx : firstGameSlot();
    } else {
      slotIdx = Math.min(slotIdx, slots.length - 1);
    }
    renderGrid();
    if (zone === 'sys' && sysItems[sysIdx] && sysItems[sysIdx].disabled) {
      sysIdx = nextEnabledSys(sysIdx - 1, -1);
    }
    select(slotIdx, true, true);
  }

  function resetOrder() {
    if (!ui.slots) return;
    const focusedId = slots[slotIdx];
    delete ui.slots;
    saveUi();
    beep('ok');
    buildSlots();
    const nextIdx = focusedId ? slots.indexOf(focusedId) : -1;
    slotIdx = nextIdx >= 0 ? nextIdx : firstGameSlot();
    renderGrid();
    zone = 'grid';
    select(slotIdx, true, true);
    toast('↺', '最近遊んだ順に並べ直しました');
  }

  function moveSlot(from, to) {
    if (from === to || from < 0 || to < 0 || from >= slots.length || to >= slots.length) return;
    if (!slots[from]) return;
    const tmp = slots[to];
    slots[to] = slots[from];
    slots[from] = tmp;
    saveCustomSlots();
    buildSlots();
    slotIdx = Math.min(to, slots.length - 1);
    renderGrid();
    zone = 'grid';
    select(slotIdx, true, true);
    beep('ok');
  }

  function makeCursorFrame() {
    const cf = el('span', 'cursor-frame');
    cf.setAttribute('aria-hidden', 'true');
    for (let k = 0; k < 4; k++) cf.appendChild(document.createElement('i'));
    return cf;
  }

  function renderGrid() {
    $('screen').dataset.rows = String(rows);
    $('zoom-label').textContent = `${rows}段`;
    $('zoom-in').disabled = rows <= 1;
    $('zoom-out').disabled = rows >= 3;

    const isCustom = Array.isArray(ui.slots) && ui.slots.length > 0;
    $('sort-reset').disabled = !isCustom;
    const hasPlayed = !!(data && data.perGame && Object.values(data.perGame).some((p) => p.last));
    $('layout-status').textContent = isCustom ? 'カスタム配置（ドラッグで移動）' : (hasPlayed ? '最近遊んだ順（ドラッグで移動可）' : 'ドラッグで自由に配置できます');

    const shelf = $('shelf');
    shelf.textContent = '';

    slots.forEach((id, i) => {
      const g = id ? gameMap.get(id) : null;
      const btn = el('button', g ? 'slot' : 'slot empty');
      btn.type = 'button';
      btn.dataset.index = String(i);
      btn.setAttribute('role', 'gridcell');

      if (g) {
        btn.setAttribute('aria-label', g.title);
        btn.style.setProperty('--c', g.color);
        btn.draggable = true;

        const face = el('div', 'tile-face');
        face.appendChild(el('div', 'tile-ico', g.icon || '🎮'));
        face.appendChild(el('div', 'tile-name', g.title));
        if (g.external) face.appendChild(el('span', 'tile-badge ext', g.sameWindow ? 'オンライン' : '別サイト ↗'));
        else if (data && data.perGame[g.id] && !data.perGame[g.id].played) face.appendChild(el('span', 'tile-badge new-game', 'NEW'));
        btn.appendChild(face);
      } else {
        btn.setAttribute('aria-label', '空きスロット');
      }

      btn.appendChild(makeCursorFrame());

      // マウスホバーでゲームを選択、クリックでゲーム起動（空きマスはクリックで選択）
      btn.addEventListener('mousemove', () => {
        if (dragFrom !== null) return;
        if (g && realMove() && (zone !== 'grid' || slotIdx !== i)) {
          zone = 'grid';
          select(i, false);
        }
      });
      btn.addEventListener('click', () => {
        zone = 'grid';
        select(i, false, !g);
        if (g) launch();
      });

      // 3DS 風ドラッグ＆ドロップ配置
      if (g) {
        btn.addEventListener('dragstart', (e) => {
          dragFrom = i;
          btn.classList.add('dragging');
          if (e.dataTransfer) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(i));
          }
          beep('move');
        });
        btn.addEventListener('dragend', () => {
          dragFrom = null;
          btn.classList.remove('dragging');
          shelf.querySelectorAll('.drop-target').forEach((n) => n.classList.remove('drop-target'));
        });
      }
      btn.addEventListener('dragover', (e) => {
        if (dragFrom === null || dragFrom === i) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        btn.classList.add('drop-target');
      });
      btn.addEventListener('dragleave', () => btn.classList.remove('drop-target'));
      btn.addEventListener('drop', (e) => {
        e.preventDefault();
        btn.classList.remove('drop-target');
        if (dragFrom !== null && dragFrom !== i) {
          const from = dragFrom;
          dragFrom = null;
          moveSlot(from, i);
        }
      });

      shelf.appendChild(btn);
    });

    requestAnimationFrame(updatePageArrows);
  }

  // ---- 表示の更新 ----
  function select(i, scroll, silent) {
    const n = slots.length;
    if (!n) return;
    const next = Math.max(0, Math.min(n - 1, i));
    if (next !== slotIdx && !silent) beep('move');
    slotIdx = next;
    const g = currentGame();
    if (g) { ui.focus = g.id; saveUi(); }
    if (scroll) {
      const t = $('shelf').children[slotIdx];
      const scroller = $('shelf-scroll');
      if (t) {
        const left = t.offsetLeft - scroller.clientWidth / 2 + t.offsetWidth / 2;
        scroller.scrollTo({ left: Math.max(0, left), behavior: silent ? 'auto' : 'smooth' });
      }
    }
    paint();
  }

  function paint() {
    const g = currentGame();
    document.documentElement.style.setProperty('--accent', g ? g.color : '#4f8cff');

    [...$('shelf').children].forEach((t, i) => t.classList.toggle('sel', zone === 'grid' && i === slotIdx));
    sysItems.forEach((b, i) => b.classList.toggle('sel', zone === 'sys' && i === sysIdx));

    const focusEl = zone === 'grid' ? $('shelf').children[slotIdx] : sysItems[sysIdx];
    if (!panel && focusEl && document.activeElement !== focusEl) focusEl.focus({ preventScroll: true });

    // 上画面のバナー更新
    const heroKey = g ? g.id : '__empty__';
    const stage = $('stage');
    stage.textContent = '';

    const wrap = el('div', 'hero-wrap');
    const card = el('div', g ? `hero-card${heroKey !== lastHeroKey ? ' pop' : ''}` : 'hero-card empty');
    card.appendChild(el('div', 'hero-icon', g ? (g.icon || '🎮') : '＋'));
    wrap.appendChild(card);
    if (g) wrap.appendChild(el('div', 'hero-shadow'));

    const info = el('div', 'hero-info');
    if (g) {
      const tags = el('div', 'hero-tags');
      tags.appendChild(el('span', 'tag', g.genre));
      const pg = data && data.perGame[g.id];
      if (g.external) tags.appendChild(el('span', 'tag subtle', g.sameWindow ? 'オンライン' : '別サイト'));
      else if (pg && !pg.played) tags.appendChild(el('span', 'tag subtle', '未プレイ'));
      info.appendChild(tags);

      info.appendChild(el('div', 'hero-title', g.title));

      const meta = [];
      if (g.external) meta.push(g.sameWindow ? 'インターネット接続が必要です' : '別のサイトで開きます');
      else if (pg && pg.plays) meta.push(`${pg.plays}回プレイ`, window.ALLGAME_DATA.duration(pg.ms), `最終プレイ ${window.ALLGAME_DATA.ago(pg.last)}`);
      else meta.push('まだ遊んでいません');
      info.appendChild(el('div', 'hero-meta', meta.join('　·　')));
      info.appendChild(el('div', 'hero-prog', (pg && pg.progress) || ''));
    } else {
      const tags = el('div', 'hero-tags');
      tags.appendChild(el('span', 'tag subtle', '空きスロット'));
      info.appendChild(tags);
      info.appendChild(el('div', 'hero-title', 'あきマス'));
      info.appendChild(el('div', 'hero-meta', 'ゲームアイコンをドラッグするか、Shift＋矢印キーでここに移動できます'));
      info.appendChild(el('div', 'hero-prog', ''));
    }
    stage.append(wrap, info);
    lastHeroKey = heroKey;

    // 下画面中央の「はじめる」ボタン
    const cta = $('play-cta');
    if (g) {
      cta.disabled = false;
      cta.textContent = g.external && !g.sameWindow ? `↗ ${g.title} を開く` : `▶ はじめる`;
    } else {
      cta.disabled = true;
      cta.textContent = 'ゲームを選んでください';
    }

    renderHints();
  }

  function renderHints() {
    const h = $('hints');
    h.textContent = '';
    const add = (keys, label) => {
      const w = el('div', 'h');
      keys.forEach((k) => w.appendChild(el('span', /^[AB]$/.test(k) ? 'key pad' : 'key', k)));
      w.appendChild(el('span', null, label));
      h.appendChild(w);
    };
    const ok = padConnected ? 'A' : 'Enter', back = padConnected ? 'B' : 'Esc';
    if (panel) {
      add(['↑', '↓'], '選択'); add([ok], '決定'); add([back], '閉じる');
    } else if (zone === 'grid') {
      add(['←→↑↓'], '選択');
      add([ok], currentGame() && currentGame().external ? '開く' : 'はじめる');
      add(['+', '−'], '段数');
    } else {
      add(['←', '→'], '選択'); add([ok], '決定'); add(['↓'], 'ゲームへ');
    }
    $('ver-info').textContent = `${padConnected ? '🎮 接続中　' : ''}v${version}`;
  }

  // ---- ゲームを開く ----
  function launch() {
    const g = currentGame();
    if (!g) return;
    beep('ok');
    if (g.external && !g.sameWindow) { window.open(g.url, '_blank', 'noopener'); return; }
    if (g.sameWindow && navigator.onLine === false) {
      toast('🌐', 'インターネット接続が必要です', '接続してから、もう一度開いてください');
      return;
    }
    $('fade').classList.add('on');
    setTimeout(() => { location.href = g.url; }, 230);
  }
  window.addEventListener('pageshow', () => {
    $('fade').classList.remove('on');
  });

  // ---- パネル ----
  function openPanel(kind) {
    panel = kind;
    beep('open');
    const sheet = $('sheet');
    sheet.textContent = '';
    const close = el('button', 'btn close', '閉じる'); close.type = 'button';
    close.addEventListener('click', closePanel);
    sheet.appendChild(close);
    ({ stamps: panelStamps, records: panelRecords, save: panelSave, help: panelHelp })[kind](sheet);
    $('overlay').classList.add('open');
    const first = sheet.querySelector('.btn.primary') || close;
    first.focus({ preventScroll: true });
    markPanelFocus();
    renderHints();
  }
  function closePanel() {
    if (!panel) return;
    panel = null;
    beep('back');
    $('overlay').classList.remove('open');
    paint();
  }
  $('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closePanel(); });
  const panelButtons = () => [...$('sheet').querySelectorAll('button')];
  function markPanelFocus() { panelButtons().forEach((b) => b.classList.toggle('sel', b === document.activeElement)); }
  function movePanel(d) {
    const list = panelButtons();
    if (!list.length) return;
    const i = list.indexOf(document.activeElement);
    const next = list[(i + d + list.length) % list.length];
    next.focus(); next.scrollIntoView({ block: 'nearest' });
    beep('move'); markPanelFocus();
  }

  function panelStamps(sheet) {
    const got = data.stamps.filter((s) => s.got).length;
    sheet.appendChild(el('h2', null, 'スタンプカード'));
    sheet.appendChild(el('div', 'sub', `${got} / ${data.stamps.length} 個　·　ゲームごとのスタンプと、ゲームをまたいだ共通スタンプがあります`));
    const grid = el('div', 'stamps');
    if (got === data.stamps.length) grid.appendChild(el('div', 'complete', 'スタンプ全獲得 すべてのゲームを遊び込みました'));
    const rank = (s) => (s.isNew ? 2 : s.got ? 1 : 0);
    [...data.stamps].sort((a, b) => rank(b) - rank(a)).forEach((s) => {
      const item = el('div', `stamp${s.got ? ' got' : ''}${s.isNew ? ' new' : ''}`);
      item.style.setProperty('--c', s.color);
      item.title = s.got && s.at ? `${new Date(s.at).toLocaleDateString('ja-JP')} に獲得` : `目標: ${s.goal}`;
      const text = el('div');
      text.append(el('div', 's-title', s.title), el('div', 's-goal', s.goal));
      item.append(el('div', 'seal', s.got ? '獲得' : '未獲得'), text);
      grid.appendChild(item);
    });
    sheet.appendChild(grid);
    data.stamps.forEach((s) => { s.isNew = false; });
    const dot = sysItems[0] && sysItems[0].querySelector('.dot'); if (dot) dot.remove();
  }

  function panelRecords(sheet) {
    const D = window.ALLGAME_DATA;
    sheet.appendChild(el('h2', null, '記録'));
    sheet.appendChild(el('div', 'sub', 'このブラウザで遊んだ記録です。プレイ時間は操作している間だけ数えています'));
    const stats = el('div', 'stats');
    const add = (l, v) => { const s = el('div', 'stat'); s.append(el('div', 'l', l), el('div', 'v', v)); stats.appendChild(s); };
    add('合計プレイ時間', data.totalMs ? D.duration(data.totalMs) : '—');
    add('遊んだゲーム', `${data.playedCount} / ${data.total}`);
    add('遊んだ日数', `${data.days}日`);
    add('スタンプ', `${data.stamps.filter((s) => s.got).length} / ${data.stamps.length}`);
    sheet.appendChild(stats);
    const table = el('table', 'rec');
    const head = el('tr');
    ['ゲーム', '回数', 'プレイ時間', '最後に遊んだ'].forEach((h, i) => { const th = el('th', null, h); if (i) th.style.textAlign = 'right'; head.appendChild(th); });
    table.appendChild(head);
    games.filter((g) => !g.external)
      .sort((a, b) => data.perGame[b.id].ms - data.perGame[a.id].ms)
      .forEach((g) => {
        const p = data.perGame[g.id];
        const tr = el('tr');
        const td = el('td'); const name = el('div', 'g'); name.append(el('span', null, g.icon || ''), el('span', null, g.title));
        td.appendChild(name); td.appendChild(el('div', 'p', p.progress || (p.played ? '' : 'まだ遊んでいません')));
        tr.append(td, el('td', 'n', p.plays ? `${p.plays}回` : '—'), el('td', 'n', p.ms ? D.duration(p.ms) : '—'), el('td', 'n', p.last ? D.ago(p.last) : '—'));
        table.appendChild(tr);
      });
    sheet.appendChild(table);
  }

  function panelSave(sheet) {
    sheet.appendChild(el('h2', null, 'セーブ'));
    sheet.appendChild(el('div', 'sub', '全部のゲームのセーブとプレイ記録を、1つのファイルにまとめて保存・復元できます'));
    const row = el('div'); row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap';
    const ex = el('button', 'btn primary', 'セーブを書き出す'); ex.type = 'button';
    ex.addEventListener('click', () => { beep('ok'); window.ALLGAME_BACKUP.exportSaves(); });
    const im = el('button', 'btn', 'セーブを読み込む'); im.type = 'button';
    im.addEventListener('click', () => { beep('ok'); window.ALLGAME_BACKUP.importSaves(); });
    row.append(ex, im);
    sheet.appendChild(row);
    sheet.appendChild(el('div', 'note', 'パソコンを買い替えたときや、別のブラウザで続きを遊びたいときは、書き出したファイルを新しいほうで読み込んでください。読み込むと、同じゲームのセーブは上書きされます。'));
  }

  function panelHelp(sheet) {
    sheet.appendChild(el('h2', null, '操作方法'));
    sheet.appendChild(el('div', 'sub', 'キーボード・マウス・コントローラーのどれでも操作できます'));
    const keys = el('div', 'keys');
    const row = (ks, label) => { const k = el('div', 'k'); ks.forEach((x) => k.appendChild(el('span', /^[AB]$/.test(x) ? 'key pad' : 'key', x))); keys.append(k, el('div', null, label)); };
    row(['←', '→', '↑', '↓'], 'マス目の中を移動してゲームを選択（最上段で ↑ を押すと上のメニューバーへ移動）');
    row(['Enter'], 'はじめる・決定（Space でも OK）');
    row(['+', '−'], 'アイコンの表示サイズ・段数（1段〜3段）を切り替え');
    row(['Shift', '矢印'], '選んでいるゲームアイコンを隣のマスへ移動（マウスではドラッグ＆ドロップ）');
    row(['Esc'], 'パネルを閉じる・ゲームグリッドに戻る');
    row(['T'], 'ダークモード / ホワイトモード切り替え');
    row(['[', ']'], '効果音の音量を下げる・上げる（M でミュート切り替え）');
    row(['A', 'B'], 'コントローラー：A で決定、B で戻る（十字キーかスティックで選択）');
    sheet.appendChild(keys);
    sheet.appendChild(el('div', 'note', 'ゲーム中にこの画面へ戻るときは、画面の上の真ん中にマウスを近づけると出てくる「◀ ALLGAME」を押します。F11 で全画面になります。'));
  }

  // ---- 通知 ----
  function toast(icon, title, sub) {
    const t = el('div', 'toast');
    if (icon) t.appendChild(el('div', 'ti', icon));
    const text = el('div'); text.append(el('div', null, title)); if (sub) { const s = el('div', null, sub); s.style.cssText = 'color:var(--muted);font-size:12px'; text.appendChild(s); }
    t.appendChild(text);
    $('toasts').appendChild(t);
    beep('ok');
    setTimeout(() => t.remove(), 4300);
  }

  // ---- 操作（キーボード・コントローラー共通）----
  function stepGrid(a) {
    const col = Math.floor(slotIdx / rows);
    const row = slotIdx % rows;
    const cols = Math.ceil(slots.length / rows);
    if (a === 'left') return col > 0 ? (col - 1) * rows + row : slotIdx;
    if (a === 'right') return col + 1 < cols ? Math.min(slots.length - 1, (col + 1) * rows + row) : slotIdx;
    if (a === 'up') return row > 0 ? slotIdx - 1 : -1;
    if (a === 'down') return row + 1 < rows && slotIdx + 1 < slots.length ? slotIdx + 1 : slotIdx;
    return slotIdx;
  }

  function nextEnabledSys(start, dir) {
    let i = start;
    while (i >= 0 && i < sysItems.length) {
      if (!sysItems[i].disabled) return i;
      i += dir;
    }
    return sysIdx;
  }

  function act(a, shift) {
    if (!slots.length) return;
    if (panel) {
      if (a === 'back') closePanel();
      else if (a === 'up' || a === 'left') movePanel(-1);
      else if (a === 'down' || a === 'right') movePanel(1);
      else if (a === 'ok' && document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.click();
      return;
    }
    if (zone === 'grid') {
      if (a === 'ok') { launch(); return; }
      if (['left', 'right', 'up', 'down'].includes(a)) {
        const target = stepGrid(a);
        if (target === -1) {
          if (!shift && sysItems.length) {
            zone = 'sys';
            sysIdx = nextEnabledSys(Math.min(sysIdx, sysItems.length - 1), -1);
            beep('move');
            paint();
          }
          return;
        }
        if (shift && target !== slotIdx && slots[slotIdx]) {
          moveSlot(slotIdx, target);
        } else {
          select(target, true);
        }
      }
    } else {
      if (a === 'left') { const n = nextEnabledSys(sysIdx - 1, -1); if (n !== sysIdx) { sysIdx = n; beep('move'); paint(); } }
      else if (a === 'right') { const n = nextEnabledSys(sysIdx + 1, 1); if (n !== sysIdx) { sysIdx = n; beep('move'); paint(); } }
      else if (a === 'down' || a === 'back') { zone = 'grid'; beep('move'); paint(); }
      else if (a === 'ok' && sysItems[sysIdx] && !sysItems[sysIdx].disabled) sysItems[sysIdx].click();
    }
  }

  const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'ok', ' ': 'ok', Escape: 'back', Backspace: 'back' };
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const inRange = e.target && e.target.tagName === 'INPUT';
    if (e.key === 'm' || e.key === 'M') { $('sound').click(); return; }
    if (e.key === 't' || e.key === 'T') { toggleTheme(); return; }
    if (e.key === '[') { setVolume(effectiveVolume() - 10, true); e.preventDefault(); return; }
    if (e.key === ']') { setVolume(effectiveVolume() + 10, true); e.preventDefault(); return; }
    if (inRange) {
      if (e.key === 'Escape') { e.target.blur(); paint(); e.preventDefault(); }
      return;
    }
    if (!panel && (e.key === '+' || e.key === '=')) { setRows(rows - 1); e.preventDefault(); return; }
    if (!panel && (e.key === '-' || e.key === '_')) { setRows(rows + 1); e.preventDefault(); return; }
    if (e.key === 'Home' && !panel) { zone = 'grid'; select(firstGameSlot(), true); e.preventDefault(); return; }
    if (e.key === 'End' && !panel) { zone = 'grid'; select(lastGameSlot(), true); e.preventDefault(); return; }
    const a = KEYMAP[e.key];
    if (!a) return;
    e.preventDefault(); // ボタン既定の Enter/Space の動きと二重にならないように
    act(a, e.shiftKey);
  });
  document.addEventListener('focusin', () => { if (panel) markPanelFocus(); });

  // コントローラー（Gamepad API）: 十字キー・左スティックで移動、A で決定、B で戻る
  const held = {};
  function pollPads() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const was = padConnected;
    padConnected = pads.length > 0;
    if (was !== padConnected) renderHints();
    const now = performance.now();
    const state = { up: false, down: false, left: false, right: false, ok: false, back: false };
    for (const p of pads) {
      const b = (i) => !!(p.buttons[i] && p.buttons[i].pressed);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      state.up ||= b(12) || ay < -.6; state.down ||= b(13) || ay > .6;
      state.left ||= b(14) || ax < -.6; state.right ||= b(15) || ax > .6;
      state.ok ||= b(0); state.back ||= b(1);
    }
    for (const k of Object.keys(state)) {
      if (state[k]) {
        const h = held[k];
        if (!h) { held[k] = { next: now + 380 }; act(k, false); }
        else if (!['ok', 'back'].includes(k) && now >= h.next) { h.next = now + 120; act(k, false); }
      } else delete held[k];
    }
    requestAnimationFrame(pollPads);
  }
  window.addEventListener('gamepadconnected', () => { padConnected = true; renderHints(); toast('🎮', 'コントローラーをつなぎました', 'A で決定、B で戻る'); });
  requestAnimationFrame(pollPads);
})();
</script>
